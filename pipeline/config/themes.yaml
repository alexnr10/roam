  - id: plages
    name: Littoral et plages
    name_singular: Site
    name_hints: [plage, anse, crique]
    icon: beach
    kind: nature
    # Ni portes ni horaires : 7 % seulement des lieux de ce thème ont
    # une ouverture attestée dans OpenStreetMap, parce qu'il n'y a rien à
    # y attester. Le bonus d'accueil du public ne s'y applique pas.
    gated: false
    radius_m: 500
    # UN SEUL des sept thèmes de nature où le plancher de notoriété est à un, et
    # c'est mesuré, pas concédé. `gaps --class Q40080` recense 647 plages
    # françaises situées chez Wikidata :
    #
    #     ≥0 langues  647
    #     ≥1 langues  473
    #     ≥2 langues   98   ← plancher de collecte d'alors
    #     ≥3 langues   20   ← plancher de notoriété d'alors
    #
    # Vingt plages pour toute la France. Ce n'était pas un filtre, c'était un
    # mur, et il se voyait dans le résultat : sur cent vingt-deux lieux du
    # thème, soixante-cinq étaient des caps ou des pointes et vingt et un
    # seulement portaient le mot « plage » — dont les cinq plages du
    # Débarquement, qui sont des sites historiques, et onze d'outre-mer. La
    # métropole hors Normandie 1944 apportait CINQ plages.
    #
    # Le décompte de versions linguistiques mesure la notoriété d'un MONUMENT.
    # Pampelonne plafonne à sept langues là où une cathédrale médiocre en a
    # douze. Appliqué au littoral, il ne trie pas, il rase.
    #
    # Un à la collecte comme à la notoriété veut dire : « quelqu'un a écrit un
    # article ». C'est le vrai plancher, et il écarte quand même les cent
    # soixante-quatorze objets sans article, qui n'ont ni texte ni
    # consultations — donc rien sur quoi les départager.
    #
    # Ce qui trie ensuite, c'est le SCORE, et pour ce thème il est porté par les
    # consultations : trois cent trente-six des quatre cent treize lieux
    # côtiers en ont, les plages du Prado font 5 758 vues par mois quand la
    # médiane du thème est à 46. Le plafond de catalogue ci-dessous est ce qui
    # rend la manœuvre sûre — sans lui, baisser le plancher serait un
    # recensement.
    min_sitelinks: 1
    fetch_min_sitelinks: 1
    cap: 60
    # Le thème en portait cent vingt-deux avec l'ancien plancher : le plafond
    # garde l'empreinte d'alors et laisse changer la COMPOSITION, pas le volume.
    # Il est aussi la seule barrière du thème maintenant que le plancher n'en
    # est plus une — les six classes de reliefs côtiers descendent elles aussi
    # à une langue, et leur réserve n'est pas mesurée.
    catalogue_cap: 120
    # Une région n'a droit à sa place garantie que si elle a une côte, et le
    # vivier le dit sans qu'on ait à écrire la liste des régions littorales.
    # Mesuré sur la collecte au plancher relâché — 930 lieux côtiers situés :
    #
    #     Bretagne 190 · PACA 158 · Guadeloupe 157 · Nouvelle-Aquitaine 66 ·
    #     Occitanie 65 · La Réunion 55 · Mayotte 55 · Normandie 48 · Corse 47 ·
    #     Auvergne-Rhône-Alpes 21 · Pays de la Loire 18 · Martinique 17 ·
    #     Guyane 16 · Hauts-de-France 13
    #     ——— puis, d'un coup ———
    #     Île-de-France 1 · Grand Est 1 · Bourgogne-Franche-Comté 1 ·
    #     Centre-Val de Loire 1
    #
    # Treize contre un. Le seuil est posé à cinq : assez haut pour qu'un objet
    # isolé ne soit pas une côte, assez bas pour ne pas se caler sur les treize
    # des Hauts-de-France — régler un seuil sur la valeur exacte qu'on veut
    # préserver, c'est fabriquer le résultat, pas le mesurer.
    #
    # Ce réglage est par thème et doit le rester. Le vivier des quatre
    # cathédrales d'outre-mer vaut UN, comme celui de l'Île-de-France ici : un
    # seuil global les emporterait, alors que ce sont elles que le minimum
    # régional a été écrit pour sauver.
    min_region_pool: 5
    wikidata_classes: [Q40080, Q107679, Q185113, Q191992, Q34763, Q1026259, Q6502866]
    # plage, falaise, cap, cap (promontoire marin), péninsule, calanque,
    # falaise côtière.
    #
    # Q107679 porte en français le libellé « rempart montagneux », mais sa
    # définition est bien l'escarpement rocheux — c'est la classe d'Étretat.
    # À surveiller en revue : elle ramènera aussi des escarpements de montagne.
    # Q6502866 « falaise côtière » est la classe précise pour la même idée —
    # gardée à côté plutôt qu'à sa place, faute de savoir laquelle Wikidata
    # peuple le mieux sans avoir tourné une vraie collecte.
    #
    # Deux entités « cap » coexistent sur Wikidata, aux définitions presque
    # identiques. Les deux sont retenues : si l'une dérive de l'autre, la
    # requête la couvre déjà, et sinon aucune n'est perdue. La déduplication
    # par identifiant fait le ménage.
    #
    # « promontoire » (Q1245089) écarté : il désigne un éperon rocheux dominant
    # une étendue quelconque, pas une formation littorale. Il aurait rempli le
    # thème d'affleurements de l'intérieur des terres.
    #
    # « presqu'île » (Q2362867, « petite péninsule ») délibérément absente :
    # sous-classe de péninsule (Q34763) déjà retenue ci-dessus — l'ajouter
    # aurait recréé pour ce couple le doublon qu'on assume déjà pour « cap ».
    #
    # Un thème `littoral` a été créé puis fondu ici : je ne m'étais pas
    # aperçu, en l'ajoutant, que ce thème couvrait déjà exactement le même
    # terrain sous le nom « Littoral et plages ». `calanque` et
    # `falaise côtière` sont ce qu'il apportait de réellement neuf.

