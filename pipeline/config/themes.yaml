# Thèmes du catalogue Roam.
#
# `wikidata_classes` : Q-ids vérifiés avec `python -m roam_pipeline verify-qids`,
#                      qui affiche le libellé réel de chacun. Ne jamais écrire un
#                      Q-id de mémoire : une erreur ne lève aucune exception, elle
#                      fait rater un thème entier en silence.
# `search`           : termes encore à résoudre. `suggest-qids` propose des
#                      candidats ; le Q-id retenu rejoint `wikidata_classes` et le
#                      terme disparaît d'ici.
# `from_labels`      : thème alimenté par des listes officielles plutôt que par une
#                      classe Wikidata.
#
# ⚠️  L'ORDRE DE DÉCLARATION EST SIGNIFIANT. Un même lieu peut relever de
#     plusieurs thèmes — le château de Versailles est aussi un palais, le Louvre
#     est un palais et un musée. Il n'appartient au catalogue qu'une fois, sous
#     le PREMIER thème déclaré ici. Les thèmes vont donc du plus spécifique au
#     plus générique.
# `radius_m`         : rayon de validation par défaut des lieux du thème (mètres).
# `min_sitelinks`      : plancher ÉDITORIAL, appliqué à la construction. Se règle
#                        instantanément, sans recollecter.
# `fetch_min_sitelinks`: plancher de COLLECTE, appliqué dans la requête SPARQL.
#                        Il ne sert qu'à garder les requêtes tenables : le laisser
#                        bas permet de régler le plancher éditorial librement.
# `cap`              : nombre maximum de lieux retenus pour la collection nationale.
# `kind`             : « nature » ou « culture ». Roam promet des PAYSAGES autant
#                      que du patrimoine ; `build` affiche l'équilibre entre les
#                      deux pour qu'une dérive vers le bâti ne passe pas inaperçue.
#                      Les jardins comptent en nature : dessinés de main d'homme,
#                      mais on y va pour le paysage.

themes:
  - id: villages
    name: Villages de caractère
    name_singular: Village
    icon: village
    kind: culture
    radius_m: 600
    min_sitelinks: 3
    fetch_min_sitelinks: 2
    cap: 80
    wikidata_classes: []
    from_labels: [plus-beaux-villages, plus-beaux-detours]

  - id: cathedrales
    name: Cathédrales et basiliques
    name_singular: Cathédrale
    icon: cathedral
    kind: culture
    radius_m: 120
    min_sitelinks: 10
    fetch_min_sitelinks: 4
    cap: 60
    wikidata_classes: [Q2977, Q163687]               # cathédrale, basilique

  # Pas de classe Wikidata : « commune française » ramènerait les 35 000 communes.
  # Les labels sont ici la seule sélection défendable — et ils sont déjà finis.

  - id: abbayes
    name: Abbayes et monastères
    name_singular: Abbaye
    icon: abbey
    kind: culture
    radius_m: 150
    min_sitelinks: 8
    fetch_min_sitelinks: 3
    cap: 60
    wikidata_classes: [Q160742, Q44613]              # abbaye, monastère

  - id: chateaux
    name: Châteaux
    name_singular: Château
    icon: castle
    kind: culture
    radius_m: 200
    min_sitelinks: 8
    fetch_min_sitelinks: 3
    cap: 80
    wikidata_classes: [Q23413, Q751876, Q1785071]   # château fort, château, fort

  - id: musees
    name: Musées
    name_singular: Musée
    icon: museum
    kind: culture
    radius_m: 120
    min_sitelinks: 12
    fetch_min_sitelinks: 4
    cap: 50
    wikidata_classes: [Q33506]                       # musée

  # Trou constaté à la relecture : Giverny, l'auberge Ravoux où mourut Van Gogh
  # et les maisons d'écrivains n'entraient dans aucun thème. Ce sont pourtant
  # des lieux pour lesquels on vient du monde entier.
  - id: maisons
    name: Maisons d'artistes et d'écrivains
    name_singular: Maison
    icon: house
    kind: culture
    radius_m: 150
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 50
    wikidata_classes: [Q2087181, Q11982370, Q5755620, Q24906026, Q2072285, Q746628]
    # maison-musée (le bâtiment), maison-musée d'artiste, maison-musée
    # (l'institution), maison d'écrivain, atelier (le bâtiment), atelier (le lieu)
    #
    # Deux couples portent le même libellé français pour des entités
    # différentes : le BÂTIMENT et l'INSTITUTION d'une part, le LIEU de travail
    # et le BÂTIMENT de l'autre. Impossible de savoir sans vérifier lequel
    # Wikidata emploie pour Giverny ou l'atelier Cézanne.
    #
    # Les deux sont donc retenus à chaque fois. Sur-inclure ne coûte rien : la
    # requête exige des coordonnées, le plancher filtre, et la déduplication
    # par identifiant fait le ménage. Sous-inclure ferait rater au thème
    # exactement ce pour quoi il a été créé.

  - id: monuments
    name: Monuments et édifices remarquables
    name_singular: Monument
    icon: monument
    kind: culture
    radius_m: 150
    min_sitelinks: 8
    fetch_min_sitelinks: 4
    cap: 60
    wikidata_classes: [Q143912, Q170980, Q7362268, Q19757, Q16560, Q12518, Q815448]
    # arc de triomphe, obélisque, amphithéâtre romain, théâtre romain, palais,
    # tour, beffroi
    #
    # Q12518 (« bâtiment de forme verticale ») est la classe qui manquait pour
    # la tour Eiffel. Elle est large : elle ramènera aussi des châteaux d'eau et
    # des tours de télévision. Le plancher à dix langues en écarte l'essentiel,
    # le reste se traite en revue.
    #
    # Écartés : Q99026497, qui est la charpente supportant les cloches et non
    # l'édifice, et Q750675, qui est le bien UNESCO lui-même et non une classe.

  - id: grottes
    name: Grottes et gouffres
    name_singular: Grotte
    icon: cave
    kind: nature
    radius_m: 200
    min_sitelinks: 5
    fetch_min_sitelinks: 3
    cap: 40
    wikidata_classes: [Q35509]                       # grotte

  - id: megalithes
    name: Mégalithes et sites antiques
    name_singular: Site
    icon: megalith
    kind: culture
    radius_m: 200
    min_sitelinks: 6
    fetch_min_sitelinks: 3
    cap: 50
    wikidata_classes: [Q839954, Q164240, Q101659, Q193475]
    # site archéologique, mégalithe, dolmen, menhir

  # Trou constaté à la relecture : ni la tour Eiffel ni l'arc de triomphe
  # n'entraient dans aucun thème. Les Q-ids restent à résoudre — ne rien
  # écrire de mémoire, c'est la règle depuis la première collecte.

  - id: jardins
    name: Jardins remarquables
    name_singular: Jardin
    icon: garden
    kind: nature
    radius_m: 200
    min_sitelinks: 5
    fetch_min_sitelinks: 3
    cap: 50
    wikidata_classes: [Q1107656, Q167346]            # jardin, jardin botanique
    # « jardin public » (Q22746) écarté volontairement : il ramènerait tous les
    # squares municipaux de France. Le label Jardin remarquable est le filtre.

  - id: phares
    name: Phares
    name_singular: Phare
    icon: lighthouse
    kind: culture
    radius_m: 200
    min_sitelinks: 5
    fetch_min_sitelinks: 3
    cap: 40
    wikidata_classes: [Q39715]                       # phare

  - id: ponts
    name: Ponts et viaducs
    name_singular: Pont
    icon: bridge
    kind: culture
    radius_m: 300
    min_sitelinks: 8
    fetch_min_sitelinks: 3
    cap: 40
    wikidata_classes: [Q12280, Q181348, Q13218676]   # pont, viaduc, aqueduc romain
    # « aqueduc » au sens large (Q474) écarté : c'est l'ouvrage d'adduction
    # d'eau, y compris les canalisations modernes. L'aqueduc romain, lui, se
    # visite — c'est la classe du Pont du Gard.

  - id: cascades
    name: Cascades
    name_singular: Cascade
    icon: waterfall
    kind: nature
    radius_m: 300
    min_sitelinks: 2
    fetch_min_sitelinks: 2
    cap: 60
    wikidata_classes: [Q34038]                       # chute d'eau

  - id: cirques
    name: Cirques naturels
    name_singular: Cirque
    icon: cirque
    kind: nature
    radius_m: 500
    min_sitelinks: 3
    fetch_min_sitelinks: 2
    cap: 40
    wikidata_classes: []
    search: [cirque glaciaire, cirque naturel, reculée]

  - id: gorges
    name: Gorges et canyons
    name_singular: Gorges
    icon: canyon
    kind: nature
    # Site étendu : le point est celui de l'entrée, le rayon porte la taille.
    radius_m: 2000
    min_sitelinks: 3
    fetch_min_sitelinks: 2
    cap: 40
    # « canyon » ne désigne aucune classe distincte sur Wikidata : gorge suffit.
    wikidata_classes: [Q150784]                      # gorge

  - id: lacs
    name: Lacs
    name_singular: Lac
    icon: lake
    kind: nature
    radius_m: 1500
    min_sitelinks: 8
    fetch_min_sitelinks: 3
    cap: 50
    wikidata_classes: [Q23397]                       # lac

  - id: iles
    name: Îles
    name_singular: Île
    icon: island
    kind: nature
    radius_m: 2000
    min_sitelinks: 10
    fetch_min_sitelinks: 4
    cap: 40
    wikidata_classes: [Q23442]                       # île

  # Avant `sommets` : un puy est un sommet, mais c'est d'abord un volcan.
  - id: volcans
    name: Volcans et sites volcaniques
    name_singular: Volcan
    icon: volcan
    kind: nature
    radius_m: 400
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 50
    wikidata_classes: []
    search: [volcan, puy, cratère volcanique, maar, cheminée volcanique]

  - id: sommets
    name: Sommets
    name_singular: Sommet
    icon: mountain
    kind: nature
    radius_m: 1000
    min_sitelinks: 12
    fetch_min_sitelinks: 4
    cap: 60
    wikidata_classes: [Q8502, Q2231510]              # montagne, col

  # Avant `plages` : une calanque a une plage, mais on y va pour la calanque.
  - id: littoral
    name: Littoral remarquable
    name_singular: Site du littoral
    icon: falaise
    kind: nature
    radius_m: 400
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 60
    wikidata_classes: []
    search: [calanque, cap, pointe côtière, falaise côtière, presqu'île]

  - id: plages
    name: Littoral et plages
    name_singular: Site
    icon: beach
    kind: nature
    radius_m: 500
    min_sitelinks: 3
    fetch_min_sitelinks: 2
    cap: 60
    wikidata_classes: [Q40080, Q107679, Q185113, Q191992, Q34763]
    # plage, falaise, cap, cap (promontoire marin), péninsule
    #
    # Q107679 porte en français le libellé « rempart montagneux », mais sa
    # définition est bien l'escarpement rocheux — c'est la classe d'Étretat.
    # À surveiller en revue : elle ramènera aussi des escarpements de montagne.
    #
    # Deux entités « cap » coexistent sur Wikidata, aux définitions presque
    # identiques. Les deux sont retenues : si l'une dérive de l'autre, la
    # requête la couvre déjà, et sinon aucune n'est perdue. La déduplication
    # par identifiant fait le ménage.
    #
    # « promontoire » (Q1245089) écarté : il désigne un éperon rocheux dominant
    # une étendue quelconque, pas une formation littorale. Il aurait rempli le
    # thème d'affleurements de l'intérieur des terres.

  - id: forets
    name: Forêts remarquables
    name_singular: Forêt
    icon: foret
    kind: nature
    radius_m: 800
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 40
    wikidata_classes: []
    search: [forêt domaniale, forêt remarquable, futaie]

  - id: dunes-marais
    name: Dunes et marais
    name_singular: Site
    icon: dune
    kind: nature
    radius_m: 600
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 40
    wikidata_classes: []
    search: [dune, marais salant, marais littoral, étang côtier]

  - id: rochers
    name: Rochers et curiosités géologiques
    name_singular: Site
    icon: rocher
    kind: nature
    radius_m: 300
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 50
    wikidata_classes: []
    search: [arche naturelle, chaos rocheux, aiguille rocheuse, site géologique remarquable]

  - id: sources
    name: Sources et résurgences
    name_singular: Source
    icon: source
    kind: nature
    radius_m: 250
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 40
    wikidata_classes: []
    search: [résurgence, source karstique, exsurgence]
