    # arche naturelle, résurgence, exsurgence.
    #
    # Le thème `sources` a été fondu ici : cinq candidats sur toute la France
    # ne feront jamais une collection, et une résurgence — la fontaine de
    # Vaucluse, la source de la Loue — est bien une curiosité géologique. Un
    # thème de cinq lieux n'est pas un thème, c'est une ligne morte dans
    # l'application.
    # Les trois autres termes (chaos rocheux, aiguille rocheuse, site
    # géologique remarquable) n'ont renvoyé aucune classe exploitable. Thème
    # délibérément maigre : le label site-classé et les propositions de la
    # communauté couvrent le reste plutôt qu'une classe trop large et bruitée.
