# Thèmes du catalogue Roam.
#
# `wikidata_classes` : Q-ids vérifiés avec `python -m roam_pipeline verify-qids`,
#                      qui affiche le libellé réel de chacun. Ne jamais écrire un
#                      Q-id de mémoire : une erreur ne lève aucune exception, elle
#                      fait rater un thème entier en silence.
# `search`           : termes encore à résoudre. `suggest-qids` propose des
#                      candidats ; le Q-id retenu rejoint `wikidata_classes` et le
#                      terme disparaît d'ici.
# `from_labels`      : thème alimenté par des listes officielles plutôt que par une
#                      classe Wikidata.
#
# ⚠️  L'ORDRE DE DÉCLARATION EST SIGNIFIANT. Un même lieu peut relever de
#     plusieurs thèmes — le château de Versailles est aussi un palais, le Louvre
#     est un palais et un musée. Il n'appartient au catalogue qu'une fois, sous
#     le PREMIER thème déclaré ici. Les thèmes vont donc du plus spécifique au
#     plus générique.
# `radius_m`         : rayon de validation par défaut des lieux du thème (mètres).
# `min_sitelinks`      : plancher ÉDITORIAL, appliqué à la construction. Se règle
#                        instantanément, sans recollecter.
# `fetch_min_sitelinks`: plancher de COLLECTE, appliqué dans la requête SPARQL.
#                        Il ne sert qu'à garder les requêtes tenables : le laisser
#                        bas permet de régler le plancher éditorial librement.
# `cap`              : nombre maximum de lieux retenus pour la collection nationale.
# `kind`             : « nature » ou « culture ». Roam promet des PAYSAGES autant
#                      que du patrimoine ; `build` affiche l'équilibre entre les
#                      deux pour qu'une dérive vers le bâti ne passe pas inaperçue.
#                      Les jardins comptent en nature : dessinés de main d'homme,
#                      mais on y va pour le paysage.

# Classes qui DISQUALIFIENT un lieu, quel que soit le thème par lequel il est
# entré.
#
# Marineland est arrivé dans « musées » parce qu'un de ses équipements est
# classé comme aquarium, et qu'un aquarium public est, dans la hiérarchie de
# Wikidata, une sorte de musée. Le rattachement n'est pas faux ; c'est le lieu
# qui n'a pas sa place ici. Roam propose des paysages et du patrimoine, pas des
# parcs de loisirs.
#
# La liste est globale et non par thème : le problème n'est pas qu'un
# delphinarium soit mal rangé, c'est qu'il ne doit exister nulle part.
#
# ⚠️  Une exclusion par classe est un instrument BRUT. Le Jardin des plantes
#     abrite une ménagerie ; s'il porte lui-même la classe « parc zoologique »,
#     il tombe avec elle. `build` nomme donc les lieux qu'il écarte à ce titre,
#     et `explain` le dit lieu par lieu : c'est la seule protection contre une
#     exclusion trop large, et elle suppose de lire le journal une fois.
exclude_classes:
  # Résolus par `suggest-qids`, vérifiables par `verify-qids`. Ce sont les
  # CLASSES et non les établissements : « parc animalier » (Q3363934), pas
  # « parc animalier d'Auvergne ».
  qids:
    - Q194195      # parc d'attractions
    - Q2416723     # parc à thèmes
    - Q3363974     # parc d'attractions et animalier
    - Q3363934     # parc animalier
    - Q43501       # parc zoologique
    - Q2281788     # aquarium public — la porte par laquelle Marineland est entré
    - Q491675      # delphinarium
    - Q740326      # parc aquatique
  # Encore à résoudre : le terme générique français, sous lequel se rangent
  # les parcs qu'aucune des classes ci-dessus ne nomme.
  search:
    - parc de loisirs

themes:
  - id: villages
    name: Villages de caractère
    name_singular: Village
    icon: village
    kind: culture
    radius_m: 600
    min_sitelinks: 3
    fetch_min_sitelinks: 2
    cap: 80
    wikidata_classes: []
    from_labels: [plus-beaux-villages, plus-beaux-detours]

  - id: cathedrales
    name: Cathédrales et basiliques
    name_singular: Cathédrale
    icon: cathedral
    kind: culture
    radius_m: 120
    min_sitelinks: 10
    fetch_min_sitelinks: 4
    cap: 60
    wikidata_classes: [Q2977, Q163687, Q120560, Q56242215]
    # cathédrale, basilique, basilique mineure, cathédrale catholique
    #
    # « cathédrale catholique » n'est pas rattachée à « cathédrale » chez
    # Wikidata : 52 édifices y échappaient, dont Notre-Dame de Paris et la
    # primatiale Saint-Jean de Lyon. Deuxième trou de la même famille que les
    # basiliques mineures, trouvé par le même recensement.
    # « basilique mineure » est un TITRE canonique, pas une forme
    # architecturale : Wikidata ne la range donc pas sous « basilique »
    # (Q163687), et cinquante édifices lui échappaient — dont Notre-Dame de
    # Fourvière. Trouvé par `gaps`, qui l'a signalée à 50 absents sur 50.

  # Pas de classe Wikidata : « commune française » ramènerait les 35 000 communes.
  # Les labels sont ici la seule sélection défendable — et ils sont déjà finis.

  - id: abbayes
    name: Abbayes et monastères
    name_singular: Abbaye
    icon: abbey
    kind: culture
    radius_m: 150
    min_sitelinks: 8
    fetch_min_sitelinks: 3
    cap: 60
    wikidata_classes: [Q160742, Q44613]              # abbaye, monastère

  - id: chateaux
    name: Châteaux
    name_singular: Château
    icon: castle
    kind: culture
    radius_m: 200
    min_sitelinks: 8
    fetch_min_sitelinks: 3
    cap: 80
    wikidata_classes: [Q23413, Q751876, Q1785071]   # château fort, château, fort

  # AVANT `musees`, et c'est essentiel : une maison-musée est une
  # sous-classe de musée. Déclaré après, ce thème perdait Giverny, la
  # maison de Van Gogh et l'atelier Cézanne au profit de `musees` — neuf
  # lieux sur trente, et précisément les mieux documentés. Il ne lui
  # restait que deux lieux, sous le minimum d'une collection.
  - id: maisons
    name: Maisons d'artistes et d'écrivains
    name_singular: Maison
    icon: house
    kind: culture
    radius_m: 150
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 50
    wikidata_classes: [Q2087181, Q11982370, Q5755620, Q24906026, Q2072285, Q746628]
    # maison-musée (le bâtiment), maison-musée d'artiste, maison-musée
    # (l'institution), maison d'écrivain, atelier (le bâtiment), atelier (le lieu)
    #
    # La fondation Claude-Monet à Giverny — la maison et les jardins de Monet —
    # n'est, chez Wikidata, qu'une « maison » (Q3947). Aucune des classes
    # ci-dessus ne la voit, et elle manquait purement et simplement au
    # catalogue. Collecter Q3947 au plancher du thème ramènerait en revanche
    # toutes les maisons de France.
    #
    # Le plancher est la sortie : à onze langues, on ne parle plus d'un
    # pavillon. C'est le seul filtre disponible quand la classe ne dit rien.
    broad_classes:
      - qid: Q3947            # maison
        fetch_min_sitelinks: 8
        # Un palais est, chez Wikidata, une sorte de maison — et `maisons` est
        # déclaré avant `musees`. Le Petit Palais se retrouvait donc en
        # « maison d'artiste », avec tous les musées-palais. La classe n'est
        # pas fausse : c'est la ROUTE qui l'est. Un palais-musée relève de
        # `musees`, et l'exception le lui rend.
        except: []
        except_search:
          - palais
    #
    # Deux couples portent le même libellé français pour des entités
    # différentes : le BÂTIMENT et l'INSTITUTION d'une part, le LIEU de travail
    # et le BÂTIMENT de l'autre. Impossible de savoir sans vérifier lequel
    # Wikidata emploie pour Giverny ou l'atelier Cézanne.
    #
    # Les deux sont donc retenus à chaque fois. Sur-inclure ne coûte rien : la
    # requête exige des coordonnées, le plancher filtre, et la déduplication
    # par identifiant fait le ménage. Sous-inclure ferait rater au thème
    # exactement ce pour quoi il a été créé.

  - id: musees
    name: Musées
    name_singular: Musée
    icon: museum
    kind: culture
    radius_m: 120
    min_sitelinks: 12
    fetch_min_sitelinks: 4
    cap: 50
    wikidata_classes: [Q33506, Q207694]              # musée, musée d'art
    # « musée d'art » devrait être une sous-classe de « musée » et remonter
    # toute seule ; dans les faits elle ne le fait pas, et `gaps` a compté 55
    # absents sur 62 — dont le Petit Palais. Une hiérarchie qu'on suppose ne
    # remplace pas une classe qu'on déclare.

  # Trou constaté à la relecture : Giverny, l'auberge Ravoux où mourut Van Gogh
  # et les maisons d'écrivains n'entraient dans aucun thème. Ce sont pourtant
  # des lieux pour lesquels on vient du monde entier.
  - id: monuments
    name: Monuments et édifices remarquables
    name_singular: Monument
    icon: monument
    kind: culture
    radius_m: 150
    min_sitelinks: 8
    fetch_min_sitelinks: 4
    cap: 60
    wikidata_classes: [Q143912, Q170980, Q7362268, Q19757, Q16560, Q12518, Q815448]
    # arc de triomphe, obélisque, amphithéâtre romain, théâtre romain, palais,
    # tour, beffroi
    #
    # Q12518 (« bâtiment de forme verticale ») est la classe qui manquait pour
    # la tour Eiffel. Elle est large : elle ramènera aussi des châteaux d'eau et
    # des tours de télévision. Le plancher à dix langues en écarte l'essentiel,
    # le reste se traite en revue.
    #
    # Écartés : Q99026497, qui est la charpente supportant les cloches et non
    # l'édifice, et Q750675, qui est le bien UNESCO lui-même et non une classe.

  - id: grottes
    name: Grottes et gouffres
    name_singular: Grotte
    icon: cave
    kind: nature
    radius_m: 200
    min_sitelinks: 5
    fetch_min_sitelinks: 3
    cap: 40
    wikidata_classes: [Q35509]                       # grotte

  - id: megalithes
    name: Mégalithes et sites antiques
    name_singular: Site
    icon: megalith
    kind: culture
    radius_m: 200
    min_sitelinks: 6
    fetch_min_sitelinks: 3
    cap: 50
    wikidata_classes: [Q839954, Q164240, Q101659, Q193475]
    # site archéologique, mégalithe, dolmen, menhir

  # Trou constaté à la relecture : ni la tour Eiffel ni l'arc de triomphe
  # n'entraient dans aucun thème. Les Q-ids restent à résoudre — ne rien
  # écrire de mémoire, c'est la règle depuis la première collecte.

  - id: jardins
    name: Jardins remarquables
    name_singular: Jardin
    icon: garden
    kind: nature
    radius_m: 200
    min_sitelinks: 5
    fetch_min_sitelinks: 3
    cap: 50
    wikidata_classes: [Q1107656, Q167346]            # jardin, jardin botanique
    # « jardin public » (Q22746) écarté volontairement : il ramènerait tous les
    # squares municipaux de France. Le label Jardin remarquable est le filtre.

  - id: phares
    name: Phares
    name_singular: Phare
    icon: lighthouse
    kind: culture
    radius_m: 200
    min_sitelinks: 5
    fetch_min_sitelinks: 3
    cap: 40
    wikidata_classes: [Q39715]                       # phare

  - id: ponts
    name: Ponts et viaducs
    name_singular: Pont
    icon: bridge
    kind: culture
    radius_m: 300
    min_sitelinks: 8
    fetch_min_sitelinks: 3
    cap: 40
    wikidata_classes: [Q12280, Q181348, Q13218676]   # pont, viaduc, aqueduc romain
    # « aqueduc » au sens large (Q474) écarté : c'est l'ouvrage d'adduction
    # d'eau, y compris les canalisations modernes. L'aqueduc romain, lui, se
    # visite — c'est la classe du Pont du Gard.

  - id: cascades
    name: Cascades
    name_singular: Cascade
    icon: waterfall
    kind: nature
    radius_m: 300
    min_sitelinks: 2
    fetch_min_sitelinks: 2
    cap: 60
    wikidata_classes: [Q34038]                       # chute d'eau

  - id: cirques
    name: Cirques naturels
    name_singular: Cirque
    icon: cirque
    kind: nature
    radius_m: 500
    min_sitelinks: 3
    fetch_min_sitelinks: 2
    cap: 40
    wikidata_classes: [Q388227, Q184368, Q664803]   # cirque glaciaire, cirque, reculée

  - id: gorges
    name: Gorges et canyons
    name_singular: Gorges
    icon: canyon
    kind: nature
    # Site étendu : le point est celui de l'entrée, le rayon porte la taille.
    radius_m: 2000
    min_sitelinks: 3
    fetch_min_sitelinks: 2
    cap: 40
    # « canyon » ne désigne aucune classe distincte sur Wikidata : gorge suffit.
    wikidata_classes: [Q150784]                      # gorge

  - id: lacs
    name: Lacs
    name_singular: Lac
    icon: lake
    kind: nature
    radius_m: 1500
    # Abaissé de 8 à 6 : ce plancher compte les versions
    # linguistiques, c'est-à-dire la DOCUMENTATION d'un lieu. Wikidata
    # documente bien moins la nature que le bâti, et ce thème se retrouvait
    # avec le même seuil que les châteaux — 349 lacs entraient, 44 sortaient. Le vivier double à 6.
    min_sitelinks: 6
    fetch_min_sitelinks: 3
    cap: 50
    wikidata_classes: [Q23397]                       # lac

  - id: iles
    name: Îles
    name_singular: Île
    icon: island
    kind: nature
    radius_m: 2000
    # Abaissé de 10 à 8 : ce plancher compte les versions
    # linguistiques, c'est-à-dire la DOCUMENTATION d'un lieu. Wikidata
    # documente bien moins la nature que le bâti, et ce thème se retrouvait
    # avec le même seuil que les cathédrales — l'essentiel de la perte est ailleurs (216 îles sur 416 sont
    # outre-mer, sans département), mais le seuil restait celui du bâti.
    min_sitelinks: 8
    fetch_min_sitelinks: 4
    cap: 40
    wikidata_classes: [Q23442]                       # île

  # Avant `sommets` : un puy est un sommet, mais c'est d'abord un volcan.
  - id: volcans
    name: Volcans et sites volcaniques
    name_singular: Volcan
    icon: volcan
    kind: nature
    radius_m: 400
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 50
    wikidata_classes: [Q8072, Q109391, Q192503, Q2261752]
    # volcan, cratère volcanique, maar, cheminée volcanique.
    # « puy » n'a renvoyé aucune classe exploitable : les puys notables sont
    # déjà couverts par « volcan » ou par le thème sommets. À ajouter à la
    # main (data/manual/places.csv) si un puy précis manque.

  - id: sommets
    name: Sommets
    name_singular: Sommet
    icon: mountain
    kind: nature
    radius_m: 1000
    # Abaissé de 12 à 8 : ce plancher compte les versions
    # linguistiques, c'est-à-dire la DOCUMENTATION d'un lieu. Wikidata
    # documente bien moins la nature que le bâti, et ce thème se retrouvait
    # avec le même seuil que les musées — sur 497 sommets non alpins, 458 étaient écartés ici, bien plus
    # que par le filtre alpin (369).
    min_sitelinks: 8
    fetch_min_sitelinks: 4
    cap: 60
    wikidata_classes: [Q8502, Q2231510]              # montagne, col

  # Avant `plages` : une dune est une plage, mais on y va pour la dune.
  # Déclaré après `plages` au premier jet, ce thème perdait 15 lieux sur 17
  # au dédoublonnage — le Pilat comptait comme une plage.
  - id: dunes-marais
    name: Dunes et marais
    name_singular: Site
    icon: dune
    kind: nature
    radius_m: 600
    # Abaissé de 4 à 2, comme les cascades et les curiosités géologiques.
    # L'entonnoir montre que le thème n'a que onze lieux à cette étape : les
    # étangs côtiers partent aux `lacs`, déclarés avant lui — un étang côtier
    # EST un lac, la priorité est correcte. À 4, il n'en restait que deux et
    # le thème n'avait aucune collection ; à 2, les onze passent.
    min_sitelinks: 2
    fetch_min_sitelinks: 2
    cap: 40
    wikidata_classes: [Q25391, Q244326, Q55706997, Q135951980]
    # dune, marais salant, marais maritime (pour « marais littoral »),
    # étang côtier.

  - id: plages
    name: Littoral et plages
    name_singular: Site
    icon: beach
    kind: nature
    radius_m: 500
    min_sitelinks: 3
    fetch_min_sitelinks: 2
    cap: 60
    wikidata_classes: [Q40080, Q107679, Q185113, Q191992, Q34763, Q1026259, Q6502866]
    # plage, falaise, cap, cap (promontoire marin), péninsule, calanque,
    # falaise côtière.
    #
    # Q107679 porte en français le libellé « rempart montagneux », mais sa
    # définition est bien l'escarpement rocheux — c'est la classe d'Étretat.
    # À surveiller en revue : elle ramènera aussi des escarpements de montagne.
    # Q6502866 « falaise côtière » est la classe précise pour la même idée —
    # gardée à côté plutôt qu'à sa place, faute de savoir laquelle Wikidata
    # peuple le mieux sans avoir tourné une vraie collecte.
    #
    # Deux entités « cap » coexistent sur Wikidata, aux définitions presque
    # identiques. Les deux sont retenues : si l'une dérive de l'autre, la
    # requête la couvre déjà, et sinon aucune n'est perdue. La déduplication
    # par identifiant fait le ménage.
    #
    # « promontoire » (Q1245089) écarté : il désigne un éperon rocheux dominant
    # une étendue quelconque, pas une formation littorale. Il aurait rempli le
    # thème d'affleurements de l'intérieur des terres.
    #
    # « presqu'île » (Q2362867, « petite péninsule ») délibérément absente :
    # sous-classe de péninsule (Q34763) déjà retenue ci-dessus — l'ajouter
    # aurait recréé pour ce couple le doublon qu'on assume déjà pour « cap ».
    #
    # Un thème `littoral` a été créé puis fondu ici : je ne m'étais pas
    # aperçu, en l'ajoutant, que ce thème couvrait déjà exactement le même
    # terrain sous le nom « Littoral et plages ». `calanque` et
    # `falaise côtière` sont ce qu'il apportait de réellement neuf.

  - id: forets
    name: Forêts remarquables
    name_singular: Forêt
    icon: foret
    kind: nature
    radius_m: 800
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 40
    wikidata_classes: [Q3079027]   # forêt domaniale
    # « forêt remarquable » : aucun résultat. « futaie » écarté à dessein :
    # un type de peuplement forestier très commun, pas un critère de beauté —
    # même piège que les 289 801 sites OSM du tout début. Le label Forêt
    # d'Exception (ONF) porte la curation qualitative sur ce thème.

  - id: rochers
    name: Curiosités géologiques
    name_singular: Curiosité
    icon: rocher
    kind: nature
    radius_m: 300
    # Plancher à 2 et non 4 : à 4, ce thème tombait à six lieux, sous le
    # minimum de huit exigé pour former une collection. Le vivier est petit,
    # le plancher doit l'être aussi.
    min_sitelinks: 2
    fetch_min_sitelinks: 2
    cap: 50
    wikidata_classes: [Q954501, Q112269120, Q590992]
    # arche naturelle, résurgence, exsurgence.
    #
    # Le thème `sources` a été fondu ici : cinq candidats sur toute la France
    # ne feront jamais une collection, et une résurgence — la fontaine de
    # Vaucluse, la source de la Loue — est bien une curiosité géologique. Un
    # thème de cinq lieux n'est pas un thème, c'est une ligne morte dans
    # l'application.
    # Les trois autres termes (chaos rocheux, aiguille rocheuse, site
    # géologique remarquable) n'ont renvoyé aucune classe exploitable. Thème
    # délibérément maigre : le label site-classé et les propositions de la
    # communauté couvrent le reste plutôt qu'une classe trop large et bruitée.
