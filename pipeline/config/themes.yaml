# Thèmes du catalogue Roam.
#
# `wikidata_classes` : Q-ids utilisés dans la requête SPARQL (P31/P279* → classe).
#   ⚠️  Ces identifiants doivent être vérifiés avant la première collecte :
#       `python -m roam_pipeline verify-qids`
#       affiche le libellé réel de chaque Q-id pour contrôle.
#
# `radius_m`     : rayon de validation par défaut des lieux du thème (mètres).
# `min_sitelinks`: plancher de notoriété — en dessous, le lieu n'est même pas proposé.
# `cap`          : nombre maximum de lieux retenus pour la collection nationale.

themes:
  - id: chateaux
    name: Châteaux
    name_singular: Château
    icon: castle
    radius_m: 200
    min_sitelinks: 4
    cap: 80
    wikidata_classes: [Q23413, Q751876, Q1785071]   # castle, château, fort

  - id: cascades
    name: Cascades
    name_singular: Cascade
    icon: waterfall
    radius_m: 300
    min_sitelinks: 2
    cap: 60
    wikidata_classes: [Q34038]                       # waterfall

  - id: sommets
    name: Sommets
    name_singular: Sommet
    icon: mountain
    radius_m: 1000
    min_sitelinks: 4
    cap: 60
