# Thèmes du catalogue Roam.
#
# `wikidata_classes` : Q-ids vérifiés avec `python -m roam_pipeline verify-qids`,
#                      qui affiche le libellé réel de chacun. Ne jamais écrire un
#                      Q-id de mémoire : une erreur ne lève aucune exception, elle
#                      fait rater un thème entier en silence.
# `search`           : termes encore à résoudre. `suggest-qids` propose des
#                      candidats ; le Q-id retenu rejoint `wikidata_classes` et le
#                      terme disparaît d'ici.
# `from_labels`      : thème alimenté par des listes officielles plutôt que par une
#                      classe Wikidata.
#
# ⚠️  L'ORDRE DE DÉCLARATION EST SIGNIFIANT. Un même lieu peut relever de
#     plusieurs thèmes — le château de Versailles est aussi un palais, le Louvre
#     est un palais et un musée. Il n'appartient au catalogue qu'une fois, sous
#     le PREMIER thème déclaré ici. Les thèmes vont donc du plus spécifique au
#     plus générique.
# `radius_m`         : rayon de validation par défaut des lieux du thème (mètres).
# `min_sitelinks`      : plancher ÉDITORIAL, appliqué à la construction. Se règle
#                        instantanément, sans recollecter.
# `fetch_min_sitelinks`: plancher de COLLECTE, appliqué dans la requête SPARQL.
#                        Il ne sert qu'à garder les requêtes tenables : le laisser
#                        bas permet de régler le plancher éditorial librement.
# `cap`              : nombre maximum de lieux retenus pour la collection nationale.
# `kind`             : « nature » ou « culture ». Roam promet des PAYSAGES autant
#                      que du patrimoine ; `build` affiche l'équilibre entre les
#                      deux pour qu'une dérive vers le bâti ne passe pas inaperçue.
#                      Les jardins comptent en nature : dessinés de main d'homme,
#                      mais on y va pour le paysage.

# Classes qui DISQUALIFIENT un lieu, quel que soit le thème par lequel il est
# entré.
#
# Marineland est arrivé dans « musées » parce qu'un de ses équipements est
# classé comme aquarium, et qu'un aquarium public est, dans la hiérarchie de
# Wikidata, une sorte de musée. Le rattachement n'est pas faux ; c'est le lieu
# qui n'a pas sa place ici. Roam propose des paysages et du patrimoine, pas des
# parcs de loisirs.
#
# La liste est globale et non par thème : le problème n'est pas qu'un
# delphinarium soit mal rangé, c'est qu'il ne doit exister nulle part.
#
# ⚠️  Une exclusion par classe est un instrument BRUT. Le Jardin des plantes
#     abrite une ménagerie ; s'il porte lui-même la classe « parc zoologique »,
#     il tombe avec elle. `build` nomme donc les lieux qu'il écarte à ce titre,
#     et `explain` le dit lieu par lieu : c'est la seule protection contre une
#     exclusion trop large, et elle suppose de lire le journal une fois.
exclude_classes:
  # Résolus par `suggest-qids`, vérifiables par `verify-qids`. Ce sont les
  # CLASSES et non les établissements : « parc animalier » (Q3363934), pas
  # « parc animalier d'Auvergne ».
  qids:
    - Q194195      # parc d'attractions
    - Q2416723     # parc à thèmes
    - Q3363974     # parc d'attractions et animalier
    - Q3363934     # parc animalier
    - Q43501       # parc zoologique
    - Q2281788     # aquarium public — la porte par laquelle Marineland est entré
    - Q491675      # delphinarium
    - Q740326      # parc aquatique
  # Encore à résoudre : le terme générique français, sous lequel se rangent
  # les parcs qu'aucune des classes ci-dessus ne nomme.
    - Q15982170    # parc de loisirs — le terme générique français
  # Le thème « Mégalithes et sites antiques » collecte « site archéologique »
  # (Q839954), et une épave EST un site archéologique sous-marin chez Wikidata.
  # Six sont dans la collecte :
  #
  #     Q473794 Amoco Cadiz (25 langues) · Q1354330 Erika (17) ·
  #     Q3381131 HNoMS Svenner (10) · Q1389657 SS Galeka (8) ·
  #     Q502558 HMS Keith (7) · Q62128758 HMS Crested Eagle (3)
  #
  # Elles étaient là depuis toujours, tenues dehors par le SEUL fait que
  # Wikidata ne les situait pas. Le rattachement par azimuts leur a donné une
  # commune, et deux sont entrées au catalogue — un défaut que la nouvelle
  # passe n'a pas créé, seulement révélé. Le filtre porte donc sur la classe,
  # pas sur le rattachement.
  #
  # Q852190 est lu sur la sortie de `probe Q473794 Q1354330 Q502558`, qui la
  # déclare sur les trois : « classes déclarées : pétrolier (Q14928), épave
  # (Q852190) ». Rien de mémoire, comme depuis la première collecte.
    - Q852190      # épave — l'Amoco Cadiz n'est pas un site de visite
  search: []

themes:
  - id: villages
    name: Villages de caractère
    name_singular: Village
    name_hints: [village]
    icon: village
    kind: culture
    radius_m: 600
    min_sitelinks: 3
    fetch_min_sitelinks: 2
    cap: 80
    wikidata_classes: []
    from_labels: [plus-beaux-villages, plus-beaux-detours]

  # AVANT `cathedrales`, et c'est « basilique mineure » qui l'impose : ce
  # titre canonique est accordé à quantité d'églises abbatiales. Saint-Victor
  # de Marseille, Saint-Vincent de Metz, Alet-les-Bains partaient donc dans
  # « Cathédrales et basiliques » alors qu'ils s'appellent « Abbaye de ».
  #
  # Une abbaye qui reçoit le titre de basilique reste une abbaye : c'est ce
  # qu'on est venu voir, et c'est ce que dit son nom.
  - id: abbayes
    name: Abbayes et monastères
    name_singular: Abbaye
    name_hints: [abbaye, prieuré, chartreuse, monastère, couvent]
    icon: abbey
    kind: culture
    radius_m: 150
    min_sitelinks: 8
    fetch_min_sitelinks: 3
    cap: 60
    wikidata_classes: [Q160742, Q44613]              # abbaye, monastère

  - id: cathedrales
    name: Cathédrales et basiliques
    name_singular: Cathédrale
    name_hints: [cathédrale, basilique, collégiale]
    icon: cathedral
    kind: culture
    radius_m: 120
    min_sitelinks: 10
    fetch_min_sitelinks: 4
    cap: 60
    # Le catalogue en portait 193, la collection nationale n'en montrait que 61 :
    # les 132 autres vivaient dans les collections départementales et
    # s'affichaient toutes sur la carte. Quatre-vingts, c'est déjà la
    # cathédrale de chaque ville qui compte — la France a une centaine de
    # diocèses.
    catalogue_cap: 80
    wikidata_classes: [Q2977, Q163687, Q120560, Q56242215]
    # cathédrale, basilique, basilique mineure, cathédrale catholique
    #
    # « cathédrale catholique » n'est pas rattachée à « cathédrale » chez
    # Wikidata : 52 édifices y échappaient, dont Notre-Dame de Paris et la
    # primatiale Saint-Jean de Lyon. Deuxième trou de la même famille que les
    # basiliques mineures, trouvé par le même recensement.
    # « basilique mineure » est un TITRE canonique, pas une forme
    # architecturale : Wikidata ne la range donc pas sous « basilique »
    # (Q163687), et cinquante édifices lui échappaient — dont Notre-Dame de
    # Fourvière. Trouvé par `gaps`, qui l'a signalée à 50 absents sur 50.
    #
    # « église » (Q16970) : ÉCARTÉE, et c'est une décision, pas un oubli.
    #
    # `gaps` la donne à trente-six absents sur cinquante à douze langues —
    # Saint-Gervais-Saint-Protais, Notre-Dame-de-Bonne-Nouvelle, et par la même
    # porte Saint-Eustache et Saint-Sulpice. Ce thème ne collecte que ce qui
    # porte un TITRE (cathédrale, basilique) ; une église paroissiale n'en a
    # pas, si majeure soit-elle.
    #
    # « On laisse tomber les églises, ça ne vaut pas le coup, on a déjà les
    # cathédrales. » La France compte des dizaines de milliers d'églises, la
    # classe entrerait au plancher de collecte à quatre langues, et une
    # collection de quatre-vingts cathédrales couvre déjà l'édifice religieux
    # qu'on traverse le pays pour voir.
    #
    # À ne PAS rouvrir sans raison neuve : le trou est connu, mesuré, et assumé.
    # Ce qui le rouvrirait légitimement serait une liste officielle et FINIE
    # d'églises remarquables, comme les Plus Beaux Villages le sont pour les
    # communes — pas une classe Wikidata.

  # Pas de classe Wikidata : « commune française » ramènerait les 35 000 communes.
  # Les labels sont ici la seule sélection défendable — et ils sont déjà finis.

  - id: chateaux
    name: Châteaux
    name_singular: Château
    name_hints: [château, forteresse, citadelle, donjon]
    icon: castle
    kind: culture
    radius_m: 200
    min_sitelinks: 8
    fetch_min_sitelinks: 3
    cap: 80
    # 369 au catalogue, pour 88 dans la collection nationale. Cent cinquante
    # tient les châteaux de la Loire, les forteresses et les grandes demeures
    # sans descendre au manoir de canton.
    catalogue_cap: 150
    wikidata_classes: [Q23413, Q751876, Q1785071]   # château fort, château, fort

  # AVANT `musees`, et c'est essentiel : une maison-musée est une
  # sous-classe de musée. Déclaré après, ce thème perdait Giverny, la
  # maison de Van Gogh et l'atelier Cézanne au profit de `musees` — neuf
  # lieux sur trente, et précisément les mieux documentés. Il ne lui
  # restait que deux lieux, sous le minimum d'une collection.
  # PAS « Maisons des Illustres » : c'est le nom du label du ministère de la
  # Culture, qui a sa propre collection — deux cent treize membres. Le nom
  # appartient au label ; le thème prend celui de ce qu'il rassemble. Même
  # arbitrage que « Jardin remarquable » contre « Parcs et jardins ».
  #
  # Et PLUS « Maisons d'artistes et d'écrivains », qui énumérait deux métiers
  # pour un thème qui en couvre bien davantage : la maison Bonaparte, le château
  # de Voltaire, celui de Montaigne, La Boisserie de De Gaulle, les musées
  # Curie, Pasteur et Clemenceau. Une énumération de métiers finit toujours par
  # en oublier un.
  #
  # « Demeures » couvre en outre le cas que « maison de quelqu'un » ne dit pas :
  # les maisons célèbres SANS habitant célèbre — la villa Savoye, la villa
  # Cavrois, le Palais idéal, la maison de verre. On y va pour le bâtiment.
  - id: maisons
    name: Maisons et demeures remarquables
    name_singular: Maison
    name_hints: [maison, villa, atelier, demeure]
    icon: house
    kind: culture
    radius_m: 150
    min_sitelinks: 4
    fetch_min_sitelinks: 2
    cap: 50
    # La liste d'État s'AJOUTE aux classes, elle ne les remplace pas : la villa
    # Savoye, la maison de verre et le palais idéal ne sont pas des Maisons des
    # Illustres, et ils ont leur place ici. Ce que la liste apporte, c'est la
    # précision — une curation humaine où la hiérarchie des classes Wikidata
    # faisait entrer le palais des Papes.
    from_labels: [maisons-des-illustres]
    #
    # Mesuré une fois la liste collectée : sur 204 maisons au catalogue, 188
    # portent le label. Des seize restantes, aucune n'est un palais — ce sont
    # les demeures d'écrivains que l'État n'a pas labellisées (Saché, Nohant,
    # La Brède, Monte-Cristo, Ferney, Saint-Cosme) et les œuvres d'architecte
    # (Savoye, Cavrois, maison de verre, La Ruche). Vider `wikidata_classes`
    # au profit de la seule liste les perdrait toutes les seize.
    # Diversité géographique : vingt-neuf des cinquante-huit maisons sont parisiennes.
    # Ce n'est pas un fait de géographie mais un fait d'écriture — les
    # volcans sont vraiment en Auvergne, les ponts ne sont pas vraiment à
    # Paris. Les thèmes que la géographie concentre pour de bon (volcans,
    # phares, grottes, cascades) n'ont donc pas de quota.
    max_per_departement: 8
    wikidata_classes: [Q2087181, Q11982370, Q5755620, Q24906026, Q2072285, Q746628]
    # maison-musée (le bâtiment), maison-musée d'artiste, maison-musée
    # (l'institution), maison d'écrivain, atelier (le bâtiment), atelier (le lieu)
    #
    # La fondation Claude-Monet à Giverny — la maison et les jardins de Monet —
    # n'est, chez Wikidata, qu'une « maison » (Q3947). Aucune des classes
    # ci-dessus ne la voit, et elle manquait purement et simplement au
    # catalogue. Collecter Q3947 au plancher du thème ramènerait en revanche
    # toutes les maisons de France.
    #
    # Le plancher est la sortie : à onze langues, on ne parle plus d'un
    # pavillon. C'est le seul filtre disponible quand la classe ne dit rien.
    broad_classes:
      - qid: Q3947            # maison
        fetch_min_sitelinks: 8
        #
        # Un palais est, chez Wikidata, une sorte de maison — et `maisons` est
        # déclaré avant `musees` pour protéger les maisons-musées. Le Petit
        # Palais se retrouvait donc en « maison d'artiste ».
        #
        # Ce n'est PAS réglé ici, et c'est délibéré : interdire « palais » aux
        # maisons aurait mal rangé un palais qui serait vraiment une maison
        # d'artiste. Le dédoublonnage inter-thèmes s'en charge — une entrée par
        # classe générique cède devant n'importe quelle entrée spécifique, quel
        # que soit l'ordre des thèmes. Voir `dedupe_across_themes`.
    #
    # Deux couples portent le même libellé français pour des entités
    # différentes : le BÂTIMENT et l'INSTITUTION d'une part, le LIEU de travail
    # et le BÂTIMENT de l'autre. Impossible de savoir sans vérifier lequel
    # Wikidata emploie pour Giverny ou l'atelier Cézanne.
    #
    # Les deux sont donc retenus à chaque fois. Sur-inclure ne coûte rien : la
    # requête exige des coordonnées, le plancher filtre, et la déduplication
    # par identifiant fait le ménage. Sous-inclure ferait rater au thème
    # exactement ce pour quoi il a été créé.

  - id: musees
    name: Musées
    name_singular: Musée
    name_hints: [musée, muséum, fondation, écomusée]
    icon: museum
    kind: culture
    radius_m: 120
    min_sitelinks: 12
    fetch_min_sitelinks: 4
    # Le thème le plus embouteillé du catalogue : 274 candidats se
    # présentaient pour 50 places, si bien que chaque redressement vers les
    # musées en éjectait un autre en silence — le château de Guédelon et
    # l'hôtel-Dieu de Carpentras sont sortis sans qu'aucune décision ne les
    # vise.
    cap: 80
    # 217 au catalogue pour 87 dans la collection nationale : les 130 autres
    # vivaient dans les collections départementales et s'affichaient toutes sur
    # la carte. Cent cinquante coupe sous 88,7 — le musée national de
    # l'espéranto, le Tramway de Pithiviers à Toury, le Disneyland Railroad —
    # et garde les grands musées régionaux : Saint-Étienne, le Palais Lascaris,
    # Besançon, Orléans.
    #
    # Pas plus bas, et pour une raison propre à ce thème : les musées sont ce
    # que le catalogue a de plus VISITABLE — horaires, billets, fréquentation
    # mesurée sur 169 des 217, contre 3 cathédrales sur 80. Descendre à 100
    # coûterait les beaux-arts d'Orléans et de Besançon, qui sont exactement
    # l'usage quotidien qu'on cherche à servir.
    catalogue_cap: 150
    # Diversité géographique : soixante-douze musées sur deux cent quatre-vingt-cinq sont parisiens.
    # Ce n'est pas un fait de géographie mais un fait d'écriture — les
    # volcans sont vraiment en Auvergne, les ponts ne sont pas vraiment à
    # Paris. Les thèmes que la géographie concentre pour de bon (volcans,
    # phares, grottes, cascades) n'ont donc pas de quota.
    #
    # Abaissé de 12 à 8, la valeur des autres thèmes concentrés par
    # l'écriture. C'est le levier OBJECTIF contre l'embouteillage parisien :
    # il ne demande à personne de trancher entre un musée d'art moderne et un
    # musée des sciences — question de goût, sur laquelle un seul avis ne
    # peut pas faire loi — mais seulement de ne pas laisser une ville occuper
    # le quart de la collection. Paris passe de 23 % à 10 %, et la collection
    # de 23 à 36 départements représentés.
    max_per_departement: 8
    wikidata_classes: [Q33506, Q207694]              # musée, musée d'art
    # « musée d'art » devrait être une sous-classe de « musée » et remonter
    # toute seule ; dans les faits elle ne le fait pas, et `gaps` a compté 55
    # absents sur 62 — dont le Petit Palais. Une hiérarchie qu'on suppose ne
    # remplace pas une classe qu'on déclare.

  # Trou constaté à la relecture : Giverny, l'auberge Ravoux où mourut Van Gogh
  # et les maisons d'écrivains n'entraient dans aucun thème. Ce sont pourtant
  # des lieux pour lesquels on vient du monde entier.
  - id: monuments
    name: Monuments et édifices remarquables
    name_singular: Monument
    icon: monument
    kind: culture
    radius_m: 150
    # Abaissé de 8 à 6. `monuments` est le thème fourre-tout : il accueille ce
    # qu'aucun autre ne range, donc des édifices très hétérogènes, et un
    # plancher de 8 langues y était le deuxième plus sévère du catalogue. Il
    # écartait le passage Pommeraye (7 langues, score 92,5), le palais Gallien,
    # le théâtre romain d'Autun, les arènes de Besançon — des monuments majeurs
    # dont le seul tort est d'être à Nantes, Bordeaux, Autun ou Besançon
    # plutôt qu'à Paris. Mesuré sur le catalogue réel : 8 -> 6 fait entrer
    # 30 lieux, tous soumis à la revue ; 8 -> 4 en ferait entrer 114 et c'est
    # le premier palier où le haut de la liste devient douteux.
    min_sitelinks: 6
    fetch_min_sitelinks: 4
    cap: 60
    # Diversité géographique : dix-sept monuments sur soixante et onze sont à Paris.
    # Ce n'est pas un fait de géographie mais un fait d'écriture — les
    # volcans sont vraiment en Auvergne, les ponts ne sont pas vraiment à
    # Paris. Les thèmes que la géographie concentre pour de bon (volcans,
    # phares, grottes, cascades) n'ont donc pas de quota.
    max_per_departement: 10
    wikidata_classes: [Q143912, Q170980, Q7362268, Q19757, Q16560, Q12518,
                       Q815448, Q153562, Q25550691, Q1930585]
    # arc de triomphe, obélisque, amphithéâtre romain, théâtre romain, palais,
    # tour, beffroi, opéra, hôtel de ville, colonne de la victoire
    #
    # Les deux dernières sont lues sur `probe` :
    #     hôtel de ville de Paris (Q640968) · hôtel de ville (Q25550691)
    #     colonne Vendôme (Q1111051) · colonne de la victoire (Q1930585)
    # « thème(s) qui la reconnaissent : AUCUN » sur les deux.
    #
    # Ce sont des classes de LIEU qui nomment une sorte de monument, et elles
    # se bornent d'elles-mêmes : une mairie de village n'a pas quatre versions
    # linguistiques. À surveiller au premier build tout de même — si les hôtels
    # de ville affluent, `gaps --class Q25550691` dira où poser le plancher.
    #
    # ⚠️ TROU CONSTATÉ, RÉSOLU : les salles de spectacle.
    # L'Opéra Garnier n'est nulle part — ni dans un thème, ni même dans la
    # collecte. Seule sa bibliothèque-musée est là. Mesuré : sur les quarante et
    # un lieux collectés dont le nom contient « théâtre », « opéra » ou
    # « comédie », les QUARANTE ET UN sont antiques. C'est que les deux seules
    # classes de spectacle ici — théâtre romain et amphithéâtre romain — datent
    # de l'Antiquité, et que rien ne ramasse ce qui a été bâti depuis.
    #
    # Le nom trompe : « Palais Garnier » n'est pas rangé sous « palais »
    # (Q16560), Wikidata le classe par son usage. La classe se lit donc sur
    # l'entité, jamais de mémoire :
    #
    #     python -m roam_pipeline probe "Palais Garnier" "Opéra-Comique"
    #     python -m roam_pipeline gaps --min-sitelinks 12
    #
    # `monuments` est le bon foyer : c'est le thème fourre-tout, il accueille
    # déjà ce qu'aucun autre ne range. Manquent avec Garnier l'Opéra-Comique, le
    # Grand Théâtre de Bordeaux, l'Opéra de Lyon, les Célestins, le Châtelet —
    # des lieux pour lesquels on vient de loin.
    #
    # Les deux Q-ids sont lus sur `probe "Palais Garnier" "Opéra-Comique"` :
    #     palais Garnier (Q187840) · classes déclarées : opéra (Q153562)
    #     théâtre national de l'Opéra-Comique (Q872222) · compagnie d'opéra,
    #                                                     théâtre (Q24354)
    #     théâtre Favart (Q47419907) · opéra (Q153562), théâtre (Q24354)
    # « thème(s) qui la reconnaissent : AUCUN » sur les trois.
    #
    # « Opéra » SEUL. La classe désigne une maison d'opéra : la France en compte
    # quelques dizaines, elles sont toutes des monuments.
    #
    # « Théâtre » (Q24354) a été essayé puis RETIRÉ, et la mesure est nette :
    # même admise haut, à dix langues, elle a fait passer le thème de 240 lieux
    # bruts à 283 et le catalogue de 72 monuments à 109. Ce qu'elle ramène est
    # une salle de spectacle, pas un monument — Le Chat noir, le Bataclan, le
    # théâtre de l'Odéon. « Il ne faut pas prendre les théâtres mais seulement
    # les opéras. »
    #
    # La distinction tient : on va VOIR le Palais Garnier, on va ASSISTER à
    # quelque chose au Bataclan. Un thème de monuments range le premier.
    search: []
    #
    # Q12518 (« bâtiment de forme verticale ») est la classe qui manquait pour
    # la tour Eiffel. Elle est large : elle ramènera aussi des châteaux d'eau et
    # des tours de télévision. Le plancher à dix langues en écarte l'essentiel,
    # le reste se traite en revue.
    #
    # Écartés : Q99026497, qui est la charpente supportant les cloches et non
    # l'édifice, et Q750675, qui est le bien UNESCO lui-même et non une classe.

  - id: grottes
    name: Grottes et gouffres
    name_singular: Grotte
    name_hints: [grotte, gouffre, aven, caverne]
    icon: cave
    kind: nature
    radius_m: 200
    min_sitelinks: 5
    fetch_min_sitelinks: 3
    cap: 40
    wikidata_classes: [Q35509]                       # grotte

  - id: megalithes
    name: Mégalithes et sites antiques
    name_singular: Site
    name_hints: [dolmen, menhir, alignement, cairn, cromlech]
    icon: megalith
    kind: culture
    radius_m: 200
    min_sitelinks: 6
    fetch_min_sitelinks: 3
    cap: 50
    wikidata_classes: [Q839954, Q164240, Q101659, Q193475]
    # site archéologique, mégalithe, dolmen, menhir

  # Trou constaté à la relecture : ni la tour Eiffel ni l'arc de triomphe
  # n'entraient dans aucun thème. Les Q-ids restent à résoudre — ne rien
  # écrire de mémoire, c'est la règle depuis la première collecte.

  - id: jardins
    # PAS « Jardins remarquables » : « Jardin remarquable » est le nom d'un
    # label officiel du ministère de la Culture, qui a sa propre collection.
