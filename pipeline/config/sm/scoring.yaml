# Saint-Marin : ce qui diffère de la configuration du dépôt.
#
#     python -m roam_pipeline --pays-config sm <commande>
#
# Saint-Marin est un PAYS, pas une enclave à absorber. Le catalogue italien
# l'absorbait — `config/it/scoring.yaml`, bloc `enclaves` — et ce raccourci
# avait une raison honnête : un lieu sans département sort du catalogue avant
# d'être jugé, donc il fallait bien lui en donner un. On lui donnait Rimini.
#
# C'est une erreur géographique, et elle se voyait : la carte ouvrait les
# Marches au-dessus de Saint-Marin et filtrait les lieux de l'Émilie-Romagne.
# Elles ne se rencontraient jamais.

geo:
  country:
    qid: Q238
    code: SM
    name: Saint-Marin
    de_form: de Saint-Marin
    # L'italien au milieu, pour la même raison qu'en Italie : le service de
    # libellés rend le Q-ID lui-même quand aucune langue demandée n'existe.
    langues: fr,it,en

  # PAS DE DÉPARTEMENT, et ce n'est pas un manque : Saint-Marin se divise en
  # neuf castelli, ce qui est la maille d'une COMMUNE, pas d'un département.
  # Exiger un département ici viderait le catalogue de tous ses lieux.
  require_departement: false

collections:
  # SIX, ET NON HUIT — mesuré, et c'est une protection.
  #
  # Le plancher du dépôt est à huit lieux : en dessous, une collection n'en est
  # pas une. Il vaut pour la France, où un thème qui ne rend que sept lieux a
  # échoué à trouver son sujet. Il ne vaut pas pour un pays de soixante et un
  # kilomètres carrés, où le catalogue ENTIER fait huit lieux.
  #
  # À huit, la construction passe tout juste :
  #
  #     Le meilleur de Saint-Marin — 8 lieux, paliers [7, 1, 0]
  #
  # C'est-à-dire qu'un seul `drop` en revue ferait tomber la collection à sept,
  # et le pays n'aurait plus AUCUNE collection : ses lieux seraient écartés
  # faute de collection, le catalogue servi serait vide, et rien ne le dirait
  # autrement qu'un avertissement au milieu du `build`. Six laisse deux
  # arbitrages de marge.
  #
  # Le même plancher décide des collections de THÈME, et il faut le vérifier :
  # une fois `sommets` recollecté sans sa porte « chaîne de montagnes », le
  # thème le plus fourni du pays en garde quatre. Descendre à six n'en crée
  # donc aucune. Avant cette recollecte, `sommets` en compte six — les deux
  # Apennins compris — et une collection de thème apparaît, doublon de la
  # collection nationale. Elle disparaît avec eux.
  min_places: 6
