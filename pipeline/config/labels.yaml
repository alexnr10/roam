# Labels et référencements existants.
#
# Ils servent à la fois de SIGNAL DE QUALITÉ (bonus de score) et de COLLECTION
# DÉDIÉE. C'est de la curation humaine, officielle, et surtout FINIE : les
# meilleures amorces de catalogue disponibles gratuitement.
#
# `wikidata_query` décrit comment récupérer les membres :
#   - kind: heritage  → ?place wdt:P1435 wd:<qid>   (désignation patrimoniale)
#   - kind: member_of → ?place wdt:P463  wd:<qid>   (membre d'une organisation)
#   - kind: instance  → ?place wdt:P31/wdt:P279* wd:<qid>
#   - kind: manual    → pas de source Wikidata fiable, liste saisie à la main
#
# Un `search` sans `qid` signale un label EN ATTENTE DE RÉSOLUTION : la collecte
# l'ignore avec un avertissement. `suggest-qids` propose des candidats, `verify-qids`
# confirme le choix.

labels:
  - id: unesco
    name: Patrimoine mondial de l'UNESCO
    authority: UNESCO
    score_bonus: 40
    makes_collection: true
    wikidata_query: { kind: heritage, qid: Q9259 }   # patrimoine mondial ✓

  - id: plus-beaux-villages
    name: Les Plus Beaux Villages de France
    authority: Association Les Plus Beaux Villages de France
    score_bonus: 30
    makes_collection: true
    wikidata_query: { kind: member_of, qid: Q1010307 }   # l'association ✓

  - id: grand-site-de-france
    name: Grand Site de France
    authority: Ministère de la Transition écologique
    score_bonus: 30
    makes_collection: true
    # Q1154112 est le LABEL ; Q3456789 est le réseau d'associations qui le porte.
    # Une désignation patrimoniale se rattache au label, pas à l'organisme.
    wikidata_query: { kind: heritage, qid: Q1154112 }    # le label ✓

  # ⚠️ Ces deux-là étaient inversés : Q10387684 est « classé », Q10387575 est
  # « inscrit ». Corrigé d'après la sortie de verify-qids.
  - id: monument-historique-classe
    name: Monument historique classé
    authority: Ministère de la Culture
    score_bonus: 12
    makes_collection: false
    wikidata_query: { kind: heritage, qid: Q10387684 }   # monument historique classé ✓

  - id: monument-historique-inscrit
    name: Monument historique inscrit
    authority: Ministère de la Culture
    score_bonus: 6
    makes_collection: false
    wikidata_query: { kind: heritage, qid: Q10387575 }   # monument historique inscrit ✓

  - id: jardin-remarquable
    name: Jardin remarquable
    authority: Ministère de la Culture
    score_bonus: 18
    makes_collection: true
    wikidata_query: { kind: heritage, qid: Q498842 }     # le label ✓

  # LA LISTE OFFICIELLE DES MAISONS D'ILLUSTRES.
  #
  # Le thème `maisons` était rangé par classes Wikidata, et la hiérarchie des
  # classes ne dit pas ce qu'on vient voir : « maison-musée » attrapait le
  # palais des Papes, le palais du Tau et le Sénat, qui trônaient en tête d'un
  # thème censé rassembler les demeures d'artistes et d'écrivains.
  #
  # Une liste d'État est une curation humaine, finie et motivée. Le palais des
  # Papes n'y sera jamais, quelle que soit la façon dont Wikidata le classe.
  # C'est le même remède que pour les villages, et pour la même raison.
  #
  # 231 membres français, rattachés par désignation patrimoniale — mesuré par
  # `label-probe Q3280355`, qui donne zéro pour les deux autres façons
  # d'interroger. Ne pas se fier à ce commentaire : relancer la sonde.
  - id: maisons-des-illustres
    name: Maison des Illustres
    authority: Ministère de la Culture
    score_bonus: 20
    makes_collection: true
    wikidata_query: { kind: heritage, qid: Q3280355 }    # le label ✓

  # LES PAYSAGES ONT AUSSI LEUR LISTE OFFICIELLE.
  #
  # Le site classé au titre des paysages (loi de 1930) est au paysage ce que le
  # monument historique est au bâti : une désignation d'État, motivée, finie —
  # environ deux mille sept cents en France. Gorges, cirques, caps, forêts,
  # points de vue y figurent, et c'est exactement le vivier qui manquait au
  # catalogue.
  #
  # C'est aussi la seule réponse solide au problème des panoramas : un point de
  # vue n'a presque jamais d'article Wikipédia, mais un site classé a été jugé
  # remarquable par quelqu'un dont c'est le métier.
  - id: site-classe
    name: Site classé au titre des paysages
    authority: Ministère de la Transition écologique
    score_bonus: 25
    makes_collection: true
    wikidata_query: { kind: heritage, qid: Q3485446 }   # site classé ✓

  - id: site-inscrit
    name: Site inscrit au titre des paysages
    authority: Ministère de la Transition écologique
    score_bonus: 12
    makes_collection: false
    wikidata_query: { kind: heritage, qid: Q2290523 }   # site inscrit ✓

  # Label de l'Office national des forêts, attribué à une vingtaine de forêts
  # domaniales : la curation officielle des forêts remarquables.
  #
  # ⚠️ Le Q-id existe et est correct (verify-qids le confirme), mais la requête
  # `heritage` (P1435) a ramené ZÉRO membre sur une vraie collecte : les forêts
  # concernées ne portent pas cette désignation sur Wikidata. Un label qui
  # renvoie zéro sans lever d'erreur est exactement le bug le plus coûteux de ce
  # pipeline — il est donc basculé en saisie manuelle, comme les autres labels
  # sans propriété Wikidata fiable. Une vingtaine de forêts à lister, pas plus.
  - id: foret-exception
    name: Forêt d'Exception
    authority: Office national des forêts
    score_bonus: 15
    makes_collection: true
    wikidata_query: { kind: manual }

  - id: reserve-naturelle
    name: Réserve naturelle nationale
    authority: Office français de la biodiversité
    score_bonus: 10
    makes_collection: false
    # `instance`, pas `heritage` : une réserve naturelle EST une classe de
    # lieu, ce n'est pas une désignation apposée sur un lieu par ailleurs
    # catalogué — même distinction que celle qui a mis « parc-national » en
    # attente plus bas dans ce fichier.
    wikidata_query: { kind: instance, qid: Q19656847 }   # réserve naturelle nationale ✓

  - id: parc-naturel-regional
    name: Parc naturel régional
    authority: Fédération des parcs naturels régionaux
    score_bonus: 8
    makes_collection: false
    # `instance`, pas `heritage` : voir la note sur réserve-naturelle ci-dessus.
    wikidata_query: { kind: instance, qid: Q1818761 }   # parc naturel régional ✓

  # ⚠️ Mis en attente volontairement. La requête prévue (`instance`) ramènerait
  # les parcs eux-mêmes, pas les lieux qui s'y trouvent — or le critère C4 de la
  # charte porte sur l'APPARTENANCE d'un site à un parc, ce qui demande une
  # propriété de contenance, pas une classe. Plutôt que d'expédier une requête
  # qui ne fait pas ce qu'elle annonce, le label est neutralisé jusqu'à ce que
  # la bonne propriété soit vérifiée.
  - id: parc-national
    name: Parc national
    authority: Office français de la biodiversité
    score_bonus: 10
    makes_collection: false
    wikidata_query: { kind: manual }

  # Pas de propriété Wikidata fiable : listes à saisir à la main dans
  # data/manual/<id>.csv (colonnes : name,wikidata_id,note).
  - id: plus-beaux-detours
    name: Les Plus Beaux Détours de France
    authority: Association Les Plus Beaux Détours de France
    score_bonus: 15
    makes_collection: true
    wikidata_query: { kind: manual }

  - id: pavillon-bleu
    name: Pavillon Bleu
    authority: Teragir
    score_bonus: 8
    makes_collection: false
    wikidata_query: { kind: manual }
