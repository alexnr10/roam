# Les thèmes, à Monaco : ce qui diffère.
#
# Deux thèmes du dépôt LISENT des listes françaises, et les retirer de
# `labels.yaml` ne suffit pas — la référence resterait, pendante. On vide donc
# ici ce qu'ils vont chercher.
#
# QUINZE THÈMES SONT RETIRÉS, et aucun ne l'a été sur une intuition. Ce fichier
# a d'abord été écrit sans en retirer un seul, exprès : le dépôt ne retire un
# thème qu'après l'avoir MESURÉ. C'est la discipline qui a servi deux fois — au
# Vatican, `cathedrales` semblait évident et ne rendait qu'UN lieu sans la porte
# « église », la chapelle Sixtine passant à travers ; à Saint-Marin, `sommets`
# semblait vide et portait tout le pays.
#
# Le premier `fetch --pays-config mc` a interrogé vingt-deux thèmes et n'en a
# rempli que sept, pour vingt et un lieux :
#
#     musees 6 · plages 4 · sommets 4 · jardins 3 · monuments 2
#     cathedrales 1 · maisons 1
#
# Deux requêtes ont rendu un HTTP 502 et sont passées au deuxième essai : la
# collecte est complète, le service était simplement encombré.

themes:
  # RETIRÉ, et non vidé : le thème `villages` n'a AUCUNE classe Wikidata et ne
  # vit que de ses listes — les Plus Beaux Villages et les Plus Beaux Détours,
  # qui sont français. Lui laisser une liste vide rend la configuration
  # invalide, et `load_config` le refuse : « le thème villages n'a ni classe
  # Wikidata ni label source ». Il a raison.
  #
  # C'est aussi la bonne réponse sur le fond : Monaco n'a pas de villages, il
  # est une ville-État. Ses quartiers ne sont pas des villages, et
  # Monaco-Ville, le vieux rocher, est un quartier.
  - id: villages
    retire: true

  # Les Maisons des Illustres sont une liste du ministère français de la
  # Culture. Les six classes Wikidata du thème restent : elles ne dépendent
  # d'aucun État, et la villa Sauber comme la villa Paloma sont des maisons.
  - id: maisons
    from_labels: []

  # ── Les quinze thèmes que la collecte a rendus VIDES ───────────────────
  #
  # Mesuré par le premier `fetch --pays-config mc` : zéro lieu candidat pour
  # chacun. Ce n'est pas une surprise sur un État de deux kilomètres carrés,
  # entièrement bâti, sans cours d'eau ni relief propre — mais c'est mesuré, et
  # c'est à cela que sert un premier passage. Une requête qui ne rend rien coûte
  # une seconde à chaque collecte ; quinze en coûtent quinze, pour rien.
  #
  # Chacun revient en retirant sa ligne, le jour où un lieu justifierait qu'on
  # le redemande.
  - id: abbayes
    retire: true
  - id: chateaux
    retire: true
  - id: grottes
    retire: true
  - id: megalithes
    retire: true
  - id: phares
    retire: true
  - id: ponts
    retire: true
  - id: cascades
    retire: true
  - id: cirques
    retire: true
  - id: gorges
    retire: true
  - id: lacs
    retire: true
  - id: iles
    retire: true
  - id: volcans
    retire: true
  - id: dunes-marais
    retire: true
  - id: forets
    retire: true
  - id: rochers
    retire: true

  # ── Les sommets : la porte large rend les ALPES ────────────────────────
  #
  # Quatre candidats, et la porte « chaîne de montagnes » les sépare exactement
  # en deux, comme à Saint-Marin :
  #
  #     par une classe PROPRE              par la porte large
  #       Mont Agel            22 langues    Alpes              213 langues
  #       Chemin des Révoires  16            Alpes occidentales  40
  #
  # Les Alpes sont à TROIS CENT TRENTE KILOMÈTRES de Monaco — leur point de
  # coordonnées est en Suisse, au Mont Rose — et les Alpes occidentales à deux
  # cent trente-huit, en Savoie. Avec deux cent treize versions linguistiques,
  # les Alpes seraient devenues, et de très loin, le premier lieu de Monaco.
  #
  # `require_elevation` ne les arrête pas : elles portent 4 810 mètres, ceux du
  # mont Blanc. C'est le même piège qu'à Saint-Marin, où deux Apennins portaient
  # l'altitude du Corno Grande, à trois cents kilomètres de là.
  #
  # La porte reste ouverte en France et en Italie, où elle est mesurée et où elle
  # rend la Sainte-Victoire et l'Estérel — des massifs qu'on gravit. Un pays
  # d'un kilomètre sept sur un kilomètre huit n'a pas de massif.
  - id: sommets
    broad_classes: []

  # ── Les places : LA CLASSE ÉTAIT BONNE, LE PLANCHER COUPAIT ───────────
  #
  # `place (Q174782)` n'est déclarée par aucun thème du dépôt — en France une
  # place est un carrefour — et le Vatican avait donc failli s'ouvrir sans la
  # place Saint-Pierre. Le thème a été redéclaré ici avec les réglages du
  # Vatican, et le premier passage a rendu ZÉRO : `fetch-state.json` écrivait
  # `piazzas : {"ok": true, "lieux": 0}`, donc une requête aboutie et vide.
  #
  # Deux explications tenaient — la classe ou le plancher — et `probe` a tranché
  # en une commande :
  #
  #     place du Casino   Q95598843   Monaco, Monte-Carlo   1 langue
  #                       classes déclarées : place (Q174782)
  #     place du Palais   Q96214118   Monaco, Monaco-Ville  2 langues, article fr
  #                       classes déclarées : place (Q174782)
  #
  # LA CLASSE EST LA BONNE. C'est le plancher de collecte, à quatre langues,
  # qui les écartait — et il est hérité du Vatican, où la place Saint-Pierre en
  # a soixante-six et la cour du Belvédère quinze. Monaco est documenté tout
  # autrement : ses deux adresses les plus connues au monde ont une et deux
  # versions linguistiques.
  #
  # Le plancher descend donc à UN, comme celui des plages du dépôt, et pour la
  # même raison qui y est écrite : le plancher mesure la documentation, pas la
  # valeur. Sur deux kilomètres carrés, le vivier de `Q174782` ne peut pas
  # déborder — et ce que la collecte ramènera de trop se lit en deux minutes en
  # revue.
  #
  # Leurs scores seront bas, faute d'article et de consultations : la place du
  # Casino sortira au dernier palier. C'est honnête — une étoile ne dit pas
  # « médiocre », elle dit « à voir en passant », et ce que Roam sait d'elle
  # tient en une ligne de Wikidata.
  - id: piazzas
    name: Places monumentales
    name_singular: Place
    name_short: Places
    name_hints: [place, piazza]
    icon: piazza
    kind: culture
    gated: false
    radius_m: 150
    min_sitelinks: 1
    fetch_min_sitelinks: 1
    cap: 50
    wikidata_classes: [Q174782]                      # place

  # ── LES PLANCHERS DE NOTORIÉTÉ, RAMENÉS À CEUX DE LA COLLECTE ──────────
  #
  # Le dépôt pose DEUX planchers par thème : `fetch_min_sitelinks`, en dessous
  # duquel un lieu n'est pas assez documenté pour être un lieu, et
  # `min_sitelinks`, plus haut, qui ÉCLAIRCIT un gros catalogue. Le second est
  # mesuré sur la France, où les musées à douze langues séparent le Louvre de
  # milliers de collections municipales.
  #
  # Sur deux kilomètres carrés, il n'y a rien à éclaircir, et il coupe dans le
  # vif. Mesuré sur le premier passage — `musees` garde UN lieu sur six :
  #
  #      33  Musée océanographique            ← le seul au-dessus de douze
  #      10  Musée de l'automobile
  #       8  Musée des timbres et des monnaies
  #       5  Nouveau musée national (villa Sauber, villa Paloma)
  #       5  Musée d'Anthropologie préhistorique
  #       5  Napoleon Museum
  #
  # Aucun de ces cinq n'est une collection de village : ce sont les institutions
  # d'un État. Le plancher ne mesure pas leur valeur, il mesure la DOCUMENTATION
  # — la configuration du dépôt le dit elle-même, « un square parisien a un
  # article de Wikipédia, un beau jardin du Gers n'en a pas ». Monaco est
  # uniformément moins documenté que la France, pas uniformément moins riche.
  #
  # La règle est donc générale et non un réglage au cas par cas : sur un pays de
  # vingt et un candidats, le plancher de collection VAUT celui de la collecte.
  # Le premier filtre reste entier, le second n'a plus de catalogue à éclaircir.
  #
  # Ce que ça change, thème par thème (candidats gardés) :
  #
  #      musees       1 → 6      cathedrales  1 → 1
  #      monuments    2 → 2      jardins      3 → 3
  #      sommets      2 → 2      plages       inchangé (déjà à un)
  #
  # Si le catalogue te paraît trop large, les paliers se lisent dans la table
  # du `build` : à six langues les musées tombent à trois, à huit à trois aussi.
  - id: musees
    min_sitelinks: 4
  - id: cathedrales
    min_sitelinks: 4
  - id: monuments
    min_sitelinks: 4
  - id: jardins
    min_sitelinks: 3
  - id: sommets
    min_sitelinks: 4
  - id: maisons
    min_sitelinks: 2
