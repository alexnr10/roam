# Monaco : ce qui diffère du dépôt.
#
# LE Q-ID NE VIENT PAS DE MÉMOIRE. `suggest-qids "Monaco"` a rendu six
# candidats, et les trois pièges annoncés y étaient tous :
#
#     Q235        Monaco              micro État d'Europe fondé en 1297   ← celui-ci
#     Q3685392    commune de Monaco   unique commune de la principauté
#     Q55115      Monaco-Ville        quartier de Monaco
#     Q180305     AS Monaco FC        club de football monégasque
#     Q1943982    Monaco              groupe de musique britannique
#     Q16861797   Monaco              nom de famille
#
# Q235 est l'ÉTAT, et c'est ce que `P17` désigne : « pays ». Les deux entités
# voisines décrivent l'échelon administratif, que Wikidata porte sur `P131`
# — « situé dans l'entité territoriale » — et non sur `P17`. Choisir la commune
# aurait rendu zéro lieu pour un pays qui en a.
#
# Le fichier a d'abord porté `A_RESOUDRE`, qui refusait de se charger : c'est ce
# garde-fou qui a rendu l'étape obligatoire au lieu d'être recommandée. Un Q-id
# de PAYS entre dans le filtre de chaque requête, donc s'y tromper ne rend pas un
# thème vide, ça rend le pays vide — après une demi-heure de collecte.
#
# ⚠ SI LA COLLECTE REND ZÉRO LIEU, c'est l'entité voisine qu'il faut, et la
# liste ci-dessus dit laquelle essayer. Le Vatican a tendu ce piège : Q237 y est
# libellé « Saint-Siège ».
geo:
  country:
    qid: Q235
    code: MC
    name: Monaco
    # « du Vatican », « de Saint-Marin », « de Monaco » : cette forme sert aux
    # titres de collection — « Le meilleur de Monaco ».
    de_form: de Monaco
    # Le français est la seule langue officielle de la principauté, et les
    # libellés Wikidata des lieux monégasques sont donc déjà français. L'italien
    # suit quand même, comme pour les deux enclaves italiennes : le monégasque
    # est un parler ligure, et des noms comme « Monte-Carlo » ou « la
    # Condamine » ont leur graphie italienne. `langues` ne choisit que l'ordre
    # des libellés demandés au service, il ne coûte rien de plus par langue.
    langues: fr,it,en

  # Monaco n'a pas de subdivision au deuxième échelon : ses quartiers sont la
  # maille d'une COMMUNE. Sans cette ligne, `apply_geographic_scope` écarte
  # chaque lieu avant de le juger, et le catalogue sort vide.
  # `data/reference/mc/README.md` dit pourquoi les deux CSV sont vides.
  require_departement: false

# PAS DE `collections.min_places` POUR L'INSTANT, et c'est une leçon de
# Saint-Marin. Il y avait été abaissé à six APRÈS avoir mesuré que le pays n'en
# tenait que huit, et que le plancher du dépôt ne laissait donc aucune marge de
# revue. On mesure d'abord, on abaisse ensuite, avec le chiffre.
