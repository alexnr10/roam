# Les thèmes, au Vatican : ce qui diffère.
#
# Deux thèmes du dépôt LISENT des listes françaises, et les retirer de
# `labels.yaml` ne suffit pas — la référence resterait, pendante. On vide donc
# ici ce qu'ils vont chercher.
#
# QUINZE THÈMES SONT RETIRÉS, et aucun ne l'a été sur une intuition. Ce
# fichier a d'abord été écrit sans en retirer un seul, exprès : le dépôt ne
# retire un thème qu'après l'avoir MESURÉ. Le premier `fetch --pays-config va`
# a dit lesquels rendent zéro, le premier `build` a dit lequel ne rendait qu'un
# débordement, et c'est alors qu'ils ont sauté — chacun avec son chiffre en
# commentaire. Une requête qui ne rend rien coûte une seconde ; un thème retiré
# à tort coûte un lieu qu'on ne verra jamais.

themes:
  # RETIRÉ, et non vidé : le thème `villages` n'a AUCUNE classe Wikidata et ne
  # vit que de ses listes — les Plus Beaux Villages et les Plus Beaux Détours,
  # qui sont français. Lui laisser une liste vide rend la configuration
  # invalide, et `load_config` le refuse : « le thème villages n'a ni classe
  # Wikidata ni label source ». Il a raison.
  #
  # C'est aussi la bonne réponse sur le fond : le Vatican n'a pas de villages,
  # il EST un village. Le jour où une liste locale se résout, ces deux lignes
  # sautent et le thème revient tel quel.
  - id: villages
    retire: true

  # Les Maisons des Illustres sont une liste du ministère français. Les six
  # classes Wikidata du thème restent : elles ne dépendent d'aucun État.
  - id: maisons
    from_labels: []

  # ── Les cathédrales : sans la porte « église », il n'y en a qu'UNE ─────
  #
  # Le premier `fetch --pays-config va` a rendu UN lieu pour ce thème : la
  # basilique Saint-Pierre. Elle est une basilique (Q163687), donc une classe
  # propre du thème la revendique.
  #
  # Tout le reste du Vatican religieux est passé à travers, LA CHAPELLE SIXTINE
  # COMPRISE — quatre-vingt-dix versions linguistiques, deuxième lieu du pays
  # par la notoriété. Une chapelle n'est ni une cathédrale ni une basilique :
  # aucune classe propre ne la réclame.
  #
  # Compté sur la collecte italienne, commune du Vatican, thème cathédrales :
  # dix lieux, dont UN par une classe propre et NEUF par la porte générique
  # « église ». Ce sont eux qui manquent :
  #
  #     Chapelle Sixtine                        90 langues
  #     Antique basilique vaticane              30
  #     Chapelle Nicoline                       18
  #     Chapelle Paolina                        17
  #     Santo Stefano degli Abissini            12
  #     Saint-Martin-et-Saint-Sébastien         12
  #     Sainte-Anne-des-Palefreniers            12
  #     San Pellegrino                           8
  #     Santo Stefano degli Ungheresi            8
  #
  # C'est le même oubli que pour les places : le Vatican hérite de la
  # configuration du DÉPÔT, qui est française, et non de celle de l'Italie —
  # or la porte « église » y a été ouverte pour le pays dont les églises SONT
  # le patrimoine principal. Le Vatican l'est encore davantage.
  #
  # Huit langues, le seuil italien, et pour la même raison : une porte large
  # cède devant n'importe quelle porte précise, et une église qui est aussi une
  # basilique reste une basilique.
  #
  # PAS DE `catalogue_cap` ici. L'Italie en a un — cent cinquante — parce que
  # sans lui son catalogue portait deux cent soixante-trois églises, un lieu
  # sur neuf. Le Vatican fait quarante-quatre hectares : le plafond n'aurait
  # rien à couper.
  - id: cathedrales
    broad_classes:
      - qid: Q16970
        fetch_min_sitelinks: 8

  # ── Les treize thèmes que la collecte a rendus VIDES ───────────────────
  #
  # Mesuré par le premier `fetch --pays-config va` : zéro lieu pour chacun. Ce
  # n'est pas une surprise sur un État d'un demi-kilomètre carré sans côte, ni
  # lac, ni relief — mais c'est mesuré, et c'est à cela que sert un premier
  # passage. Une requête qui ne rend rien coûte une seconde à chaque collecte ;
  # treize en coûtent treize, pour rien.
  #
  # Chacun revient en retirant sa ligne, le jour où un lieu justifierait qu'on
  # le redemande.
  - id: chateaux
    retire: true
  - id: phares
    retire: true
  - id: ponts
    retire: true
  - id: cascades
    retire: true
  - id: cirques
    retire: true
  - id: gorges
    retire: true
  - id: lacs
    retire: true
  - id: iles
    retire: true
  - id: volcans
    retire: true
  - id: sommets
    retire: true
  - id: dunes-marais
    retire: true
  - id: forets
    retire: true
  - id: rochers
    retire: true

  # ── La plage du Vatican : un faux positif, et un seul ──────────────────
  #
  # Ce thème n'est pas rentré vide, et c'est pire. Il a rendu UN candidat :
  #
  #     Q145694  Péninsule italienne   103 langues
  #
  # Mille kilomètres de botte, déclarée au Vatican parce que Wikidata lui donne
  # TROIS pays — l'Italie, Saint-Marin et le Vatican — et que le filtre `P17`
  # suffit à la faire remonter. Le catalogue italien ne s'en aperçoit pas : la
  # péninsule n'a pas de province, et un lieu sans province sort avant d'être
  # jugé. Le Vatican n'a PAS de subdivision — `require_departement: false` —
  # donc rien ne l'arrête, et elle s'installait quatrième du pays, au premier
  # palier, devant la chapelle Sixtine.
  #
  # Le Vatican n'a pas de côte. Le thème ne peut rien rendre d'autre qu'un
  # débordement, et il est retiré pour cela, pas par intuition.
  - id: plages
    retire: true

  # ── Les places : sans ce thème, la place Saint-Pierre n'existe pas ─────
  #
  # `place (Q174782)` n'est déclarée par AUCUN thème du dépôt, et c'est une
  # décision française assumée : en France une place est un carrefour. Le thème
  # `piazzas` a donc été créé pour l'Italie — et il n'y vit que là.
  #
  # Le Vatican en hérite du même besoin, et pour son lieu le plus évident : la
  # place Saint-Pierre, soixante-six versions linguistiques, troisième lieu du
  # Vatican par la notoriété derrière la basilique et la Sixtine. Sans ce
  # thème, elle n'est collectée par rien — aucune autre classe ne la revendique
  # — et le catalogue du Vatican s'ouvrirait sans sa place.
  #
  # La cour du Belvédère (quinze langues) entre par la même porte.
  #
  # Les réglages sont ceux de l'Italie, à l'exception du plancher : à six, sur
  # un pays qui compte moins de dix places, il ne filtre rien qu'on veuille
  # perdre. Ils y sont commentés en détail — ce fichier ne les redémontre pas.
  - id: piazzas
    name: Places monumentales
    name_singular: Place
    name_short: Places
    name_hints: [place, piazza]
    icon: piazza
    kind: culture
    gated: false
    radius_m: 150
    min_sitelinks: 6
    fetch_min_sitelinks: 4
    cap: 50
    wikidata_classes: [Q174782]                      # place
