# Les listes d'État, au Vatican.
#
# Quatorze des quinze labels du dépôt sont FRANÇAIS : les Monuments
# historiques, les Plus Beaux Villages de France, les Grands Sites, les Jardins
# remarquables, les Maisons des Illustres, les Sites classés et inscrits, les
# Forêts d'Exception, les Réserves naturelles, les Parcs naturels régionaux et
# nationaux, les Plus Beaux Détours, le Pavillon Bleu.
#
# Ils ne désignent rien au Vatican, et une fusion qui ne saurait qu'ajouter
# envoyait le pipeline les interroger toutes à chaque collecte — quatorze
# requêtes Wikidata pour rien, et c'est exactement ce qui se voyait au premier
# `fetch`.
#
# L'UNESCO EST RETIRÉE ELLE AUSSI, et c'est une mesure qui l'a décidé, pas un
# principe. Le premier `fetch` lui a trouvé DEUX membres — « Centre historique
# de Rome, les biens du Saint-Siège… » et « Vatican (Q237) », c'est-à-dire le
# PAYS lui-même — et les a écartés tous les deux faute de thème.
#
# C'est juste : le bien inscrit au patrimoine mondial est la cité du Vatican
# ENTIÈRE, pas tel ou tel de ses lieux. Le label ne peut donc jamais avoir de
# membre ici, et il annonçait à chaque construction une collection sans aucun
# lieu.
#
# Il reste actif à Saint-Marin, où le bien inscrit est « le centre historique
# et le mont Titano » — le mont Titano est un lieu du catalogue.
#
# Si Wikidata inscrit un jour un lieu vatican à titre propre, cette ligne
# saute.
#
# Ce qu'il faudrait mettre à la place des quatorze autres se résout avec
# `suggest-qids` puis `verify-qids`, une liste à la fois. Rien n'est écrit ici
# tant que ce n'est pas résolu contre Wikidata : un Q-id supposé est un label
# qui ne collecte rien et ne le dit pas.

labels:
  - id: unesco
    retire: true
  - id: plus-beaux-villages
    retire: true
  - id: plus-beaux-detours
    retire: true
  - id: grand-site-de-france
    retire: true
  - id: monument-historique-classe
    retire: true
  - id: monument-historique-inscrit
    retire: true
  - id: jardin-remarquable
    retire: true
  - id: maisons-des-illustres
    retire: true
  - id: site-classe
    retire: true
  - id: site-inscrit
    retire: true
  - id: foret-exception
    retire: true
  - id: reserve-naturelle
    retire: true
  - id: parc-naturel-regional
    retire: true
  - id: parc-national
    retire: true
  - id: pavillon-bleu
    retire: true
