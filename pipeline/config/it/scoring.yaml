# L'Italie : ce qui diffère de la configuration du dépôt.
#
# Ce fichier ne dit QUE les écarts. Les quatre-vingts poids, les paliers de
# niveaux, les plafonds de collection et les règles de répartition sont du
# jugement éditorial qui ne connaît pas de frontière : ils restent dans
# `config/scoring.yaml`, et une correction faite là vaut pour les deux pays.
#
#     python -m roam_pipeline --pays-config it <commande>
#
# L'option se place avant ou après le nom de la commande, indifféremment.
#
# ⚠ CE FICHIER NE SUFFIT PAS À COLLECTER L'ITALIE. Il manque encore le
# référentiel des provinces et des régions — `data/reference/regions.csv` et
# `departements.csv` sont français et lus en dur par `geo.py`. Voir
# `docs/un-deuxieme-pays.md`.

geo:
  country:
    qid: Q38
    code: IT
    name: Italie
    # Le complément de nom que le français ne sait pas dériver.
    de_form: d'Italie

  # LES CONTOURS, pour rattacher un lieu à sa province sans réseau.
  #
  # Source : openpolis/geojson-italy, découpage officiel de l'ISTAT. Vérifié
  # le 10 septembre 2026 : 110 provinces, 5,4 Mo.
  #
  # Les noms de propriétés ne se devinent pas — ce sont ceux du producteur, et
  # c'est à peu près tout ce qui change d'un pays à l'autre :
  #
  #   prov_istat_code   "001"        code de la province, sur trois chiffres
  #   prov_name         "Torino"     son nom
  #   reg_istat_code    "01"         la région qui la contient
  #
  # La province est l'échelon qui correspond au département : cent dix contre
  # cent une, pour un pays d'un tiers plus petit. La région italienne, elle,
  # compte vingt unités — presque les dix-huit françaises.
  layers:
    departement:
      fichier: province.geojson
      code_key: prov_istat_code
      name_key: prov_name
      parent_key: reg_istat_code
      url: https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_provinces.geojson

    # ── La commune, et c'est la seule façon de l'avoir hors de France ──────
    #
    # Les deux API que `enrich` interroge pour la commune sont NATIONALES
    # (api-adresse et geo.api.gouv.fr), et `resolve_admin` ne remplit que le
    # département depuis Wikidata, jamais la commune. Le premier catalogue
    # italien l'a payé comptant : zéro commune sur 2 563 lieux — donc un
    # `max_per_commune` qui n'a pas mordu une seule fois (80 églises gardées
    # dans la seule Rome), la commune absente de chaque fiche de l'application,
    # et la maille la plus fine de la carte de conquête vide.
    #
    # Les contours communaux la rendent, par le même point-dans-polygone que
    # les provinces. Le fichier est gros — 35 Mo, 7 900 communes contre 110
    # provinces — mais il ne se télécharge qu'une fois et ne sert qu'à
    # `enrich`.
    commune:
      fichier: commune.geojson
      code_key: com_istat_code     # six chiffres, ex. 058091 pour Rome
      name_key: name
      parent_key: prov_istat_code  # le même code que la couche du dessus
      url: https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_municipalities.geojson

# ── Les dérogations communales : celles de Paris ne valent pas ici ───────
#
# `commune_overrides` est un dictionnaire, et un dictionnaire FUSIONNE clé
# par clé : sans ce `null`, l'Italie héritait de la dérogation parisienne.
# Elle était inerte — aucun code ISTAT ne fait cinq chiffres — mais le
# journal du build l'annonçait à chaque construction (« 75056 maisons 10,
# monuments 16, musees 10 »), ce qui est une fausse piste écrite en toutes
# lettres.
#
# Les siennes viendront, et la commande `derogations` les donne maintenant :
# elle montre le vivier de chaque ville au pied du plafond, thème par thème,
# avec la plus forte chute et le pas courant à côté. Le premier build
# italien avec le plafond actif dit où regarder — il retire 572 lieux à
# Rome, 213 à Venise, 64 à Milan, 61 à Florence, 53 à Naples, et il a emporté
# « Îles de Venise » en entier : vingt-huit îles qui sont toutes dans la
# même commune.
collections:
  commune_overrides: null
