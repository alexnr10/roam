# Les thèmes, en Italie : ce qui diffère.
#
# Les vingt-trois thèmes restent ceux du dépôt — un château est un château des
# deux côtés des Alpes. Ne sont écrits ici que les écarts, et chacun s'appuie
# sur un comptage réel de `gaps --pays Q38 --class <QID>`, reproduit dans
# `docs/un-deuxieme-pays.md`.

themes:
  # ── Les villages : la liste italienne à la place des françaises ────────
  #
  # Le thème n'a AUCUNE classe Wikidata : il vit entièrement de ses listes. En
  # France, les Plus Beaux Villages et les Plus Beaux Détours ; en Italie, les
  # Borghi più belli d'Italia, résolus dans `labels.yaml` (Q127107).
  #
  # Le reste du thème ne bouge pas, et le PLANCHER D'AFFICHAGE surtout pas :
  # un lieu tenu par une liste officielle de son propre thème passe outre
  # (`collections.py`, `apply_notoriety_floor`), exactement comme les Maisons des
  # Illustres en France. Un bourg de trois cents habitants documenté dans la
  # seule Wikipédia italienne reste au catalogue — c'est le jury qui l'y met,
  # pas le décompte de langues.
  #
  # Le `cap` de 80 reste lui aussi : la liste italienne en compte un peu plus
  # de trois cents, comme la française. S'il faut le relever, ce sera après un
  # build, en lisant la coupe réelle — jamais avant.
  - id: villages
    from_labels: [borghi-piu-belli]

  # ── Les maisons : les classes seules ───────────────────────────────────
  #
  # `maisons-des-illustres` est une liste du ministère français. Les six
  # classes Wikidata et la porte générique « maison » restent : elles ne
  # dépendent d'aucun État.
  #
  # ⚠ Les VILLAS ne sont pas déclarées ici, et c'est délibéré. `Q3950` en
  # classe précise à trois langues donnerait 577 lieux collectés et 275
  # au-dessus du plancher d'affichage — un gain d'environ 225 lieux. Mais 275
  # villas dans un thème qui compte 143 maisons en France noieraient les
  # maisons sous les villas. Les villas palladiennes de Vénétie et les villas
  # médicéennes sont deux séries du patrimoine mondial : elles méritent
  # probablement un thème à elles. C'est une décision de curation, pas de
  # configuration.
  - id: maisons
    from_labels: []

  # ── Les églises : la classe manquait, le plafond était un contresens ────
  #
  # `gaps --pays Q38 --class Q16970`, lieux italiens par plancher de collecte :
  #
  #     ≥0      ≥1     ≥2    ≥3    ≥4    ≥6   ≥8  ≥10  ≥12  ≥15  ≥20
  #   56648   26882  13199  3699  2125  1007  637  372  264  156   78
  #
  # Huit langues comme porte GÉNÉRIQUE, à l'image de « maison » dans le thème
  # précédent : une porte large cède devant n'importe quelle porte précise, et
  # une église qui est aussi une cathédrale reste une cathédrale.
  #
  # Le PLAFOND est l'autre moitié, et l'une sans l'autre ne sert à rien. Quatre
  # -vingts places pour l'Italie, c'est cathédrales + basiliques mineures +
  # églises ramenées à quatre-vingts dans le pays dont les églises SONT le
  # patrimoine principal : le recensement en donne déjà 460 à douze langues.
  #
  # Il est donc RETIRÉ, pas relevé. Choisir un chiffre maintenant serait une
  # estimation déguisée en mesure — les quatre-vingts français, eux, ont été
  # posés APRÈS un build, en lisant que le catalogue en portait 193 pour 61
  # montrés. Le premier build italien donnera la même lecture, et c'est là
  # qu'un plafond se décide. Le plancher d'affichage du thème (10 langues) et
  # le plafond de collection (60) tiennent d'ici là.
  - id: cathedrales
    catalogue_cap: null
    broad_classes:
      - qid: Q16970
        fetch_min_sitelinks: 8

  # ── Les forêts : retirées, la mesure ne les porte pas ──────────────────
  #
  # `gaps --pays Q38 --class Q4421`, lieux italiens de la classe « forêt » par
  # plancher :
  #
  #     ≥0   ≥1   ≥2   ≥3   ≥4   ≥6   ≥8  ≥10  ≥12  ≥15  ≥20
  #     93   83   18    5    2    1    0    0    0    0    0
  #
  # À comparer aux 2 920 françaises, dont 156 tiennent à trois langues. Le
  # plancher d'AFFICHAGE du thème est à 4 : deux forêts italiennes le passent.
  #
  # Et rien ne les repêche. La classe propre du thème, `Q3079027`, est la forêt
  # DOMANIALE — un statut de propriété du droit français, qui ne désigne rien
  # en Italie. Le label Forêt d'Exception, qui portait à lui seul sept des
  # trente-deux forêts du catalogue français, est une liste de l'ONF : retiré
  # dans `labels.yaml`. Il reste donc, littéralement, deux lieux.
  #
  # Un thème qui promet une catégorie et rend deux lignes est pire qu'un thème
  # absent — c'est le motif qui avait retiré `villages`, avant que la liste
  # italienne ne le rende. Retiré, donc, et c'est une décision de CURATION :
  # abaisser le plancher à 2 langues rendrait 18 lieux, mais ce sont les bois
  # communaux, la bande que la mesure française écarte à dessein. Le jour où
  # une liste italienne des forêts remarquables se résout, ces deux lignes
  # sautent et le thème revient tel quel.
  - id: forets
    retire: true

  # ── Les cirques : retirés, il n'y en a qu'un ───────────────────────────
  #
  # `gaps --pays Q38 --class Q388227` (cirque glaciaire) :
  #
  #     ≥0   ≥1   ≥2   ≥3   ≥4   ≥6   ≥8  ≥10  ≥12  ≥15  ≥20
  #      2    2    1    1    1    0    0    0    0    0    0
  #
  # Et la collecte confirme sur les TROIS classes du thème réunies — cirque
  # glaciaire, cirque, reculée : un lieu candidat pour toute l'Italie.
  #
  # Ce n'est pas une lacune de Wikidata, c'est de la géographie. Gavarnie, la
  # Fer-à-Cheval, Mourèze : le cirque est une forme pyrénéenne et jurassienne.
  # L'Italie a ses lacs, ses volcans et ses Dolomites, qui sont d'autres
  # thèmes. Un thème d'un seul lieu ne se garde pas.
  - id: cirques
    retire: true
