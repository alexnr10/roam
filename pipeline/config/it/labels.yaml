# Les listes d'État, en Italie.
#
# Quatorze des quinze labels du dépôt sont français : les Plus Beaux Villages
# de France, les Grands Sites, les Monuments historiques, les Jardins
# remarquables. Ils ne désignent rien en Italie — et une fusion qui ne saurait
# qu'ajouter enverrait le pipeline interroger Wikidata pour quinze listes
# étrangères, à chaque collecte, pour rien.
#
# `retire: true` les enlève. Ce qu'il faut mettre à leur place se résout avec
# `suggest-qids` puis `verify-qids`, une liste à la fois, comme les françaises
# l'ont été. Aucun n'est écrit ici tant qu'il n'est pas résolu contre
# Wikidata : un Q-id supposé est un label qui ne collecte rien et ne le dit pas.
#
# Résolue à ce jour : les Borghi più belli d'Italia, ci-dessous. Restent à
# résoudre, dans cet ordre d'utilité — les monuments nationaux, les jardins
# historiques, les parcs nationaux et régionaux, les réserves naturelles.

labels:
  # ── I Borghi più belli d'Italia ────────────────────────────────────────
  #
  # L'équivalent italien exact des Plus Beaux Villages de France : une
  # association privée, un jury, une liste finie, révisée. Elle rend au thème
  # `villages` ce que les listes françaises lui donnaient — il n'a aucune
  # classe Wikidata et ne vit que de ses listes.
  #
  # `suggest-qids` a rendu six résultats pour « I borghi più belli » ; c'est
  # Q127107 qui est l'ASSOCIATION (« association culturelle italienne »),
  # comme Q1010307 l'est en France. Les trois Q110890335/6/7 sont des pages de
  # listes régionales, pas l'autorité : `member_of` sur elles ne rendrait que
  # la région écrite. Rien n'est repris de mémoire : le Q-id vient de la sortie
  # de `suggest-qids`, et `verify-qids` doit le confirmer avant la collecte.
  - id: borghi-piu-belli
    # Gardé sans revue — et c'est ici une EXTRAPOLATION, pas une mesure.
    # En France, les quatre listes à jury ont été mesurées : 352 lieux relus,
    # 0 écarté. Celle-ci est du même genre (association, jury, liste finie),
    # jamais relue en italien. Si la première revue italienne écarte des
    # bourgs, c'est cette ligne qui saute, et elle seule.
    garde_d_office: true
    name: Les Plus Beaux Bourgs d'Italie
    authority: Association I Borghi più belli d'Italia
    score_bonus: 30
    makes_collection: true
    wikidata_query: { kind: member_of, qid: Q127107 }

  # ── Les parcs nationaux d'Italie ───────────────────────────────────────
  #
  # Une collection, et pas un thème : c'est la décision d'Alexis, et elle est
  # la bonne. Un thème aurait fait du parc un LIEU, et le catalogue aurait tenu
  # deux fois la même chose — mesuré sur les dix parcs qu'OpenStreetMap avait
  # fait entrer : six doublaient un lieu déjà présent, le parc national du
  # Vésuve et le Vésuve, celui de l'Aspromonte et l'Aspromonte, celui du Matese
  # et le Matese. « Garder uniquement le lieu mais l'ajouter à la collection. »
  #
  # Le label ne collecte donc rien : il tamponne le Vésuve, les villages des
  # Cinque Terre, les criques du Cilento — les lieux que les thèmes tiennent
  # déjà et qui se trouvent dans un parc.
  #
  # ⚠️ EN ATTENTE DE DEUX RÉSOLUTIONS, et il ne collectera rien d'ici là — en
  # le disant, à chaque `fetch`. C'est le même obstacle que la charte française
  # avait rencontré et noté sans le lever (voir `parc-national` dans le fichier
  # du dépôt) : « la requête prévue ramènerait les parcs eux-mêmes, pas les
  # lieux qui s'y trouvent ». Le type de requête `dans_une_aire` est ce qui
  # manquait — il fait les deux sauts, la propriété de situation puis la classe
  # de ce qu'elle atteint — mais ses deux identifiants se résolvent contre
  # Wikidata, jamais de mémoire :
  #
  #     python -m roam_pipeline probe --pays-config it Q635414 Q1438999 Q358729
  #         les trois parcs que la collecte contient déjà : leurs classes
  #         déclarées disent laquelle interroger.
  #     python -m roam_pipeline suggest-qids --property "aire protégée"
  #         la propriété de situation. Elle est MONDIALE : la même servira au
  #         label français le jour où il se réveillera.
  - id: parchi-nazionali
    name: Parcs nationaux d'Italie
    authority: Ministero dell'Ambiente e della Sicurezza Energetica
    # Vingt, comme les Grands Sites de France, et pour la même raison : le
    # label doit peser sans décider seul. À revoir sur mesure quand la
    # collection existera — c'est un chiffre posé, pas un chiffre mesuré.
    score_bonus: 20
    makes_collection: true
    collects: false
    wikidata_query:
      kind: dans_une_aire
      search: parc national italien
      property_search: aire protégée

  # L'UNESCO reste : c'est la seule liste de ces quinze qui ne soit pas
  # nationale, et elle vaut d'autant plus ici — l'Italie porte le plus grand
  # nombre de biens inscrits au monde.
  - id: plus-beaux-villages
    retire: true
  - id: grand-site-de-france
    retire: true
  - id: monument-historique-classe
    retire: true
  - id: monument-historique-inscrit
    retire: true
  - id: jardin-remarquable
    retire: true
  - id: maisons-des-illustres
    retire: true
  - id: site-classe
    retire: true
  - id: site-inscrit
    retire: true
  - id: foret-exception
    retire: true
  - id: reserve-naturelle
    retire: true
  - id: parc-naturel-regional
    retire: true
  - id: parc-national
    retire: true
  - id: plus-beaux-detours
    retire: true
  - id: pavillon-bleu
    retire: true
