# Paramètres de scoring et de construction des collections.
#
# Le score CLASSE, il ne DÉCIDE pas : la publication reste une validation humaine.

scoring:
  # Notoriété : log du nombre de versions linguistiques de l'article Wikipédia.
  # Il sépare le lieu réellement remarquable du clocher de village, et il n'est
  # manipulable par personne. Mais il mesure la documentation INTERNATIONALE
  # d'un lieu, pas l'envie d'y aller : le Champ-de-Mars figure dans 56 langues
  # parce que la tour Eiffel s'y trouve, les jardins de la Fontaine à Nîmes
  # dans 6. À 22, il faisait 63 % du score des jardins parisiens et plaçait des
  # parcs de traversée devant un des plus beaux jardins classiques d'Europe.
  #
  # Abaissé de 22 à 16, mesuré sur le catalogue réel : les Parisiens passent de
  # 6 à 5 dans les dix premiers jardins, la Fontaine prend la tête, Salagon
  # entre, et le classement des cascades — où les langues sont déjà plates — ne
  # bouge pas d'une ligne. 97 % du catalogue garde son niveau.
  #
  # Les consultations Wikipédia ont été mesurées comme remplacement (cf. bloc
  # `pageviews`) : corrélation de rang +0,84 avec les langues, elles disent la
  # même chose en français. Elles restent collectées et à poids nul.
  sitelinks_weight: 16.0

  # Bonus si une image est disponible sur Wikimedia Commons.
  # Un lieu sans aucune image exploitable est un mauvais lieu de collection :
  # l'app est un produit visuel.
  has_image_bonus: 8.0

  # Bonus si le lieu a un article sur la Wikipédia francophone.
  has_frwiki_bonus: 5.0

  # Taille de l'article francophone. Indispensable pour les sites naturels :
  # une cascade n'a presque jamais d'article hors du français, donc le décompte
  # de langues y est plat et ne classe rien. La longueur de l'article, elle,
  # sépare la cascade documentée de l'ébauche de trois lignes.
  article_weight: 8.0

  # Accueil du public, constaté sur OpenStreetMap (horaires, tarif, site).
  # C'est un fait de terrain, posé par des gens passés devant, et c'est la seule
  # donnée du score qui ne mesure pas la documentation d'un lieu mais sa
  # visitabilité — exactement ce qui manquait à Wikidata.
  #
  # Trois états, et le troisième compte autant que les deux autres : « non
  # renseigné » ne vaut RIEN, ni bonus ni malus. Les deux tiers des lieux
  # rapprochés n'ont pas d'horaires dans OpenStreetMap ; les pénaliser
  # reviendrait à noter le zèle des contributeurs, pas l'intérêt des lieux.
  visitable_bonus: 10.0

  # Malus quand l'accès est explicitement refusé (`access=private|no`).
  # Il fait reculer, il n'exclut pas : un château qu'on ne visite pas peut se
  # photographier depuis la route, et une alerte prévient déjà le relecteur.
  # La décision reste humaine.
  not_visitable_malus: 20.0

  # Repêchage d'un lieu qui ne franchit pas le plancher de son thème.
  #
  # DEUX conditions, et la première n'est pas négociable : son accueil du
  # public doit être ATTESTÉ par OpenStreetMap. Un plancher qui mesure la
  # documentation d'un lieu ne peut pas être franchi par plus de documentation
  # — la première version le permettait, avec un seuil de score seul, et
  # repêchait 2 757 lieux d'un coup. Photo et article francophone valent treize
  # points d'office, et presque tout monument français en a : dans le bas du
  # classement le score est presque constant, il ne discrimine rien.
  #
  # Les horaires sont une preuve d'une autre nature : un fait de terrain. C'est
  # ce qui manquait au musée des impressionnismes de Giverny — cinq langues, et
  # pourtant visité du monde entier.
  #
  # Le score sert de second filtre, pour ne pas repêcher tout ce qui ouvre une
  # billetterie. Le tableau imprimé par `build` donne le nombre de lieux
  # concernés à chaque seuil : c'est là qu'on choisit ce chiffre, pas ailleurs.
  # Abaissé de 85 à 74 EN MÊME TEMPS que le poids des langues, et pour cette
  # seule raison : c'est un seuil ABSOLU. Baisser un poids baisse tous les
  # scores, donc vide le repêchage sans que personne ne l'ait demandé — à 16 et
  # 85, le catalogue perdait 211 lieux. À 16 et 74, il en gagne 18.
  rescue_score: 74.0


  # Les bonus de label sont définis dans labels.yaml (`score_bonus`).
  # Seul le plus élevé s'applique, plus la moitié du deuxième — pour éviter
  # qu'un empilement de petits labels dépasse un site UNESCO.
  label_stacking: half_second

# Fréquentation annuelle, d'après Wikidata.
#
# C'est le seul signal gratuit qui mesure l'AFFLUENCE et non la documentation.
# Le décompte de langues classe une villa d'architecte célèbre dans les revues
# internationales devant la maison de Claude Monet, qui reçoit sept cent mille
# personnes par an : le premier mesure ce qu'on écrit d'un lieu, le second ce
# qu'il vaut le déplacement.
#
# Même règle à trois états que l'ouverture au public, et pour la même raison :
# un lieu sans chiffre ne perd RIEN. Wikidata ne renseigne la fréquentation que
# d'une minorité de sites ; pénaliser les autres reviendrait à noter le zèle
# des contributeurs. Bonus seul, jamais de malus.
visitors:
  # Résolue par `suggest-qids --property`, vérifiable par `verify-qids`.
  # Une propriété erronée ne lève rien — elle rend zéro résultat, en silence.
  property: P1174        # nombre de visiteurs par an
  search: null
  # Poids À CALIBRER sur les chiffres réels : `build` affiche la couverture et
  # la distribution. Trop haut, la fréquentation écrase tout le reste ; trop
  # bas, Giverny reste au niveau 3 de sa propre collection.
  weight: 10.0
  # Le score suit log1p(visiteurs / scale) : dix mille visiteurs valent un
  # demi-poids, dix millions en valent sept. L'écart qui compte est celui entre
  # un musée de sous-préfecture et un site national, pas entre le Louvre et
  # Versailles.
  scale: 10000

# Consultations de l'article francophone, médiane des douze derniers mois.
#
# Le décompte de langues mesure ce que le MONDE écrit d'un lieu ; celui-ci, ce
# que le public d'ICI va y chercher. Le Champ-de-Mars figure dans cinquante-six
# langues parce que la tour Eiffel s'y trouve, et les jardins de la Fontaine
# dans six : le premier classement n'en est pas un.
#
# Ce n'est pas « ça vaut le détour ». Aucune donnée gratuite ne le mesure — les
# notes Google, qui s'en approcheraient, ne peuvent être ni stockées ni
# affichées hors d'une carte Google. C'est la curiosité, son plus proche parent
# gratuit et légal.
#
# Même règle à trois états que la fréquentation : un lieu sans article, ou sans
# consultation enregistrée, ne perd RIEN.
pageviews:
  # Ce que le public d'ici va réellement voir, mois après mois.
  #
  # Activé à HUIT après deux mesures, et la première disait non. Le signal est
  # additif : mille vues valent six points à ce poids, une donnée manquante en
  # vaut zéro — un lieu dont les consultations n'ont pas été collectées ne
  # reçoit donc pas « rien », il reçoit un malus. Mille huit cent quatre-vingt-
  # dix-huit lieux étaient dans ce cas, dont la SAINTE-CHAPELLE, le viaduc de
  # Millau, Provins et Sarlat : à huit, la Sainte-Chapelle sortait du catalogue,
  # punie pour un trou de collecte. `enrich --pageviews` est une option, et la
  # collecte des plages ne l'avait jamais reçue.
  #
  # Comblée, la couverture passe de 8 192 à 10 089 lieux — il n'en reste UN
  # sans consultations. Le même poids donne alors :
  #
  #     36 lieux entrent, 27 sortent — 3 % du catalogue
  #     entrent  : Catacombes de Paris (7 057 vues), Fondation Louis-Vuitton,
  #                cathédrale d'Angers, Notre-Dame du Puy-en-Velay,
  #                Saint-Sauveur d'Aix, la Mothe-Chandeniers, Tiffauges,
  #                les grottes de Choranche, la calanque d'En-Vau
  #     sortent  : des cathédrales et châteaux à deux ou trois cents vues
  #
  # C'est la calanque d'En-Vau qui a déclenché la mesure : elle faisait 589
  # vues par mois et sortait derrière le CAP PINÈDE, terminal à conteneurs du
  # port de Marseille, qui en fait 47 — mais dont l'article Wikipédia est
  # quatre fois plus long. Le poids sur la taille d'article classait la
  # documentation ; celui-ci classe l'intérêt.
  #
  # `score_all` avertit dès que ce poids est actif et qu'un lieu a un article
  # sans consultations : le piège de la première mesure ne peut plus se tendre
  # en silence.
  #     python -m roam_pipeline weigh --theme plages --weights 0 8 16 24
  weight: 8.0
  # Le score suit log1p(vues / scale). Cinq cents vues par mois valent un
  # demi-poids : c'est l'ordre de grandeur d'un lieu que le public connaît
  # sans qu'il soit national.
  scale: 500

tiers:
  # Le niveau est RELATIF à chaque collection : les meilleurs scores prennent
  # le niveau 1, quel que soit leur score absolu.
  tier1_size: 10
  tier2_size: 25
  # Plancher absolu : on ne remplit pas pour remplir. Un lieu sous ce score
  # ne peut pas être au niveau 1 même s'il est dans les 10 meilleurs.
  tier1_min_score: 45.0
  tier2_min_score: 25.0

collections:
  # Au plus tant de lieux d'un même thème dans une même commune.
  #
  # Paris comptait 162 lieux, Marseille — la deuxième ville du catalogue — 21.
  # Sur 135 jardins français, 51 étaient parisiens ; la commune suivante en
  # avait 4. Ce n'est pas une richesse huit fois supérieure, c'est le plancher
  # qui mesure la documentation : un square parisien a un article de Wikipédia,
  # un beau jardin du Gers n'en a pas.
  #
  # Six, et le chiffre est mesuré. Ce que chaque valeur retire :
  #
  #      cap    Paris        reste de la France
  #        4    162 → 30     11 lieux (Toulouse 4, Les Eyzies 2, Lyon 1…)
  #        6    162 → 42      2 lieux (Toulouse)
  #        8    162 → 52      0
  #       10    162 → 61      0
  #
  # À six, la règle est générale mais ne mord que sur l'anomalie. Paris garde
  # 6 musées, 6 jardins, 6 monuments, 6 ponts : une liste qui ressemble à une
  # ville, quand 162 ressemblait à un recensement.
  #
  # Le couple est COMMUNE × THÈME, jamais la commune seule : « les 30 meilleurs
  # de Paris » garderait le musée Grévin (18e au score) et jetterait la
  # Sainte-Chapelle (31e), les musées parisiens écrasant tout avec leurs
  # millions de visiteurs.
  max_per_commune: 6

  # Paris est une exception, et elle est écrite en toutes lettres plutôt que
  # dissimulée dans un plafond général relevé « un peu » — qui ferait entrer un
  # septième château dans chaque ville de France pour régler un problème
  # parisien. Le code est celui de la VILLE, pas de ses vingt arrondissements.
  #
  # Six par thème y traitait le pont de Bir-Hakeim comme le Panthéon, alors que
  # la ville n'est pas également riche en tout. Mesuré sur son vivier au pied du
  # plafond :
  #
  #   jardins  55 candidats, décrochage après le 6e   (109 puis 93)  → laissé
  #   ponts    34 candidats, décrochage après le 6e   (99 puis 87)   → laissé
  #   cathédrales 17 candidats : deux sommets, Notre-Dame et le Sacré-Cœur,
  #            puis un plateau d'églises nationales autour de cent → laissé
  #   monuments 20 candidats, décrochage après le 8e  (131 puis 114)
  #   maisons   15 candidats, décrochage après le 10e (102 puis 93)
  #   musées    80 candidats, AUCUN décrochage : du Louvre à Jacquemart-André,
  #            trente-deux institutions se suivent sans rupture
  #
  # Les musées sont donc le seul cas où le chiffre ne peut pas se lire dans les
  # données — c'est un arbitrage, et il est serré à huit : « Paris est une ville
  # de monuments. » Les monuments montent à dix, au-delà de leur décrochage,
  # pour la même raison.
  commune_overrides:
    "75056":            # Paris
      # Seize, et la marche se lit dans les données. Sept classiques entrent
      # d'un coup — Invalides, Moulin-Rouge, Grand Palais, Institut de France,
      # Conciergerie, hôtel de ville, colonne Vendôme — et le vivier passe de
      # vingt à vingt-sept. À dix, ils poussaient dehors le palais du
      # Luxembourg, l'obélisque de Louxor et la tour Montparnasse : on aurait
      # échangé des classiques contre d'autres classiques.
      #
      # La coupe tombe sur une falaise MESURÉE, pas estimée : la tour
      # Montparnasse marque 131,1 et l'arc de triomphe du Carrousel 113,9 —
      # dix-sept points, le plus grand écart du bas de tableau, et les deux
      # scores sont réels. Au-dessous viennent les portes Saint-Denis et
      # Saint-Martin, la tour Jean-sans-Peur, le palais Cambon.
      #
      # À revoir sur le premier build réel : le rang des sept entrants est une
      # ESTIMATION, faute de connaître leurs consultations avant l'`enrich`.
      monuments: 16
      maisons: 10
      # Huit était trop serré : le musée de l'Armée — les Invalides — tombait
      # dixième, et l'Orangerie neuvième. Dix les récupère et s'arrête là,
      # Guimet, les Arts et Métiers, l'Institut du monde arabe, Rodin et Cluny
      # restant dehors. Attention en relisant le classement : le septième est le
      # musée national d'Art moderne, qui EST le Centre Pompidou et que le
      # dédoublonnage mange — dix au plafond font donc neuf musées réels.
      musees: 10
  # Minimum de lieux par région avant que le plafond de thème ne remplisse au
  # score. Sans lui, les quatre cathédrales des DOM tombaient d'un bloc :
  # seules dans leur région, elles ne sont jamais dans les quatre-vingts
  # meilleures de France. La métropole n'a besoin de rien — elle se répartit
  # déjà de cinq à onze par région toute seule. Un minimum de 2 ne corrige donc
  # plus rien et vole trois places à Auvergne-Rhône-Alpes pour les donner à la
  # Corse : un suffit.
  min_per_region: 1
  # Une collection n'existe que si elle a assez de lieux pour être une collection.
  min_places: 8
  # Plafond par défaut, surchargé par `cap` dans themes.yaml.
  max_places: 80
  # Part maximale d'un seul thème dans un « Le meilleur de… ». Le quota par
  # département ne peut rien pour ces collections : par construction tous leurs
  # lieux sont du même territoire. C'est son symétrique.
  #
  # « Le meilleur de Paris » comptait 41 musées sur 80 — l'embouteillage
  # parisien avait simplement déménagé depuis la collection nationale des
  # musées. À 25 % : musées 20, monuments 14, jardins 13, ponts 11.
  #
  # La part porte sur le PLAFOND (80), jamais sur les lieux présents : calculée
  # sur les lieux présents, elle coupait la Creuse de douze à huit. Et le
  # plafond monte d'un cran tant qu'il reste des places — le Centre-Val de
  # Loire n'a pas soixante lieux hors châteaux, son plafond s'établit donc à
  # trente et un et la collection reste pleine. Aucune des 256 collections ne
  # rétrécit.
  max_theme_share: 0.25
  # Étendue minimale d'un croisement thème × territoire.
  #
  # Un croisement existe parce que la machine croise tout, pas parce que
  # quelqu'un voudrait le collectionner. « Ponts et viaducs de Paris » alignait
  # trente et un ponts dans neuf kilomètres — le pont de Tolbiac, le pont Aval,
  # le pont du Garigliano. On ne collectionne pas ce qui se fait à pied en une
  # après-midi sans quitter sa ville.
  #
  # Le seuil a été mesuré, pas choisi. À 40 km la règle emportait les mégalithes
  # du Morbihan (Carnac, 31 km) et les volcans de La Réunion (38 km), qui sont
  # au contraire des raisons de faire le voyage. En triant les trente-neuf
  # croisements départementaux par étendue, la coupure est nette : tout ce qui
  # est sous 21 km est Paris, plus les musées de Toulouse et de Nice ; tout ce
  # qui est au-dessus de 27 km se défend.
  #
  # La règle ne vaut QUE pour les croisements. Un thème national doit pouvoir
  # être resserré si la France l'est (les volcans sont en Auvergne), et un
  # « Le meilleur de… » est par construction d'un seul territoire.
  #
  # Elle ne règle PAS tout : « Littoral et plages des Bouches-du-Rhône » et ses
  # huit calanques tient dans 34 km et survit. Ce n'est pas la même maladie —
  # là c'est la monotonie, pas l'étendue, et c'est l'affichage par niveau qui y
  # répond.
  min_diameter_km: 25
  # À quel point un croisement doit être CARACTÉRISTIQUE de son territoire :
  # part du thème sur place, rapportée à sa part dans le pays.
  #
  # « Cathédrales et basiliques de Provence-Alpes-Côte d'Azur » vaut exactement
  # ×1,0 — la région n'a ni plus ni moins de cathédrales que la moyenne, et
  # cette collection n'est que le thème national redécoupé. Personne ne la
  # collectionne. Les volcans du Puy-de-Dôme valent ×37, les phares du
  # Finistère ×17, les grottes de la Dordogne ×12.
  #
  # Le seuil est posé juste sous ce qu'il faut épargner : les châteaux du
  # Centre-Val de Loire (×3,0), les mégalithes du Morbihan (×4,8), les villages
  # d'Occitanie (×2,2), les musées d'Île-de-France (×2,3). En dessous de ×2, on
  # ne trouve plus que « Châteaux de Provence » (×0,4) ou « Abbayes
  # d'Île-de-France » (×0,5).
  #
  # Passé de 2,0 à 1,9 avec l'arrivée du plafond par commune, et c'est le MÊME
  # seuil exprimé dans les nouvelles unités, pas un adoucissement. Le rapport se
  # mesure contre la part nationale du thème ; retirer cent vingt lieux
  # parisiens a rétréci le catalogue de 5 %, donc gonflé cette part de 5 %, donc
  # abaissé TOUS les rapports d'autant. Cinq collections qui n'avaient perdu
  # aucun membre sont ainsi tombées d'un coup — les mégalithes de Bretagne
  # (2,06 → 1,96, Carnac compris), les villages d'Occitanie (2,07 → 1,98), les
  # abbayes de Normandie, les châteaux des Pays de la Loire, les plages de
  # Provence. À 1,9 elles reviennent toutes, et les deux seules qui restent
  # dehors sont celles qui ont vraiment perdu leurs lieux : musées et monuments
  # d'Île-de-France.
  min_theme_lift: 1.9

geo:
  # Niveaux géographiques pour lesquels on dérive des collections.
  levels: [departement, region, country]
  # Croisements thème × géographie (ex. « Châteaux de Dordogne »).
  # Soumis aux mêmes règles min_places / max_places : la plupart des croisements
  # seront donc écartés, et c'est voulu — sinon on génère des milliers de
  # collections vides du type « Cascades de la Creuse : 2 lieux ».
  cross_theme_levels: [departement, region]

  # Un lieu qu'on ne sait pas rattacher à un département français reste hors de
  # toute collection géographique : il ne peut apparaître que dans « Le meilleur
  # de France », où il concurrence le Mont Blanc. C'est le cas des collectivités
  # d'outre-mer — Polynésie, Nouvelle-Calédonie, Wallis-et-Futuna — qui n'ont pas
  # de code de département.
  #
  # Les DÉPARTEMENTS d'outre-mer (Guadeloupe, Martinique, Guyane, La Réunion,
  # Mayotte) ont un code et restent au catalogue : la ligne passe entre les DOM
  # et les COM, pas entre métropole et outre-mer.
  require_departement: true

  # Nombre de lieux visé dans CHAQUE département. En dessous, les meilleurs
  # candidats que le plancher de notoriété avait écartés sont repêchés.
  #
  # Le plancher compte les langues d'un article : il mesure la notoriété
  # INTERNATIONALE d'un lieu, et la France rurale n'en a pas. La Creuse gardait
  # un lieu sur seize, les Ardennes trois sur vingt-neuf, pendant que Paris en
  # gardait deux cent dix-huit. Ce qu'il écartait n'était pas du remplissage :
  # le château d'Oiron, les boiseries de Moutier-d'Ahun, les Pierres Jaumâtres.
  #
  # C'est le pendant géographique du quota par département des collections
  # nationales — là on empêche Paris d'occuper toute la place, ici on empêche un
  # département de n'en avoir aucune.
  #
  # Les repêchés sont MARQUÉS dans la revue : c'est le pari le plus fragile du
  # catalogue, il doit se relire comme tel.
  min_per_departement: 12

alerts:
  # Au-dessus, un sommet demande souvent bien plus qu'une randonnée. Certains
  # ont pourtant un téléphérique : c'est un signal de revue, pas une exclusion.
  alpine_elevation_m: 2500
