# Paramètres de scoring et de construction des collections.
#
# Le score CLASSE, il ne DÉCIDE pas : la publication reste une validation humaine.

scoring:
  # Notoriété : log du nombre de versions linguistiques de l'article Wikipédia.
  # Il sépare le lieu réellement remarquable du clocher de village, et il n'est
  # manipulable par personne. Mais il mesure la documentation INTERNATIONALE
  # d'un lieu, pas l'envie d'y aller : le Champ-de-Mars figure dans 56 langues
  # parce que la tour Eiffel s'y trouve, les jardins de la Fontaine à Nîmes
  # dans 6. À 22, il faisait 63 % du score des jardins parisiens et plaçait des
  # parcs de traversée devant un des plus beaux jardins classiques d'Europe.
  #
  # Abaissé de 22 à 16, mesuré sur le catalogue réel : les Parisiens passent de
  # 6 à 5 dans les dix premiers jardins, la Fontaine prend la tête, Salagon
  # entre, et le classement des cascades — où les langues sont déjà plates — ne
  # bouge pas d'une ligne. 97 % du catalogue garde son niveau.
  #
  # Les consultations Wikipédia ont été mesurées comme remplacement (cf. bloc
  # `pageviews`) : corrélation de rang +0,84 avec les langues, elles disent la
  # même chose en français. Elles restent collectées et à poids nul.
  sitelinks_weight: 16.0

  # Bonus si une image est disponible sur Wikimedia Commons.
  # Un lieu sans aucune image exploitable est un mauvais lieu de collection :
  # l'app est un produit visuel.
  has_image_bonus: 8.0

  # Bonus si le lieu a un article sur la Wikipédia francophone.
  has_frwiki_bonus: 5.0

  # Taille de l'article francophone. Indispensable pour les sites naturels :
  # une cascade n'a presque jamais d'article hors du français, donc le décompte
  # de langues y est plat et ne classe rien. La longueur de l'article, elle,
  # sépare la cascade documentée de l'ébauche de trois lignes.
  article_weight: 8.0

  # Accueil du public, constaté sur OpenStreetMap (horaires, tarif, site).
  # C'est un fait de terrain, posé par des gens passés devant, et c'est la seule
  # donnée du score qui ne mesure pas la documentation d'un lieu mais sa
  # visitabilité — exactement ce qui manquait à Wikidata.
  #
  # Trois états, et le troisième compte autant que les deux autres : « non
  # renseigné » ne vaut RIEN, ni bonus ni malus. Les deux tiers des lieux
  # rapprochés n'ont pas d'horaires dans OpenStreetMap ; les pénaliser
  # reviendrait à noter le zèle des contributeurs, pas l'intérêt des lieux.
  visitable_bonus: 10.0

  # Malus quand l'accès est explicitement refusé (`access=private|no`).
  # Il fait reculer, il n'exclut pas : un château qu'on ne visite pas peut se
  # photographier depuis la route, et une alerte prévient déjà le relecteur.
  # La décision reste humaine.
  not_visitable_malus: 20.0

  # Repêchage d'un lieu qui ne franchit pas le plancher de son thème.
  #
  # DEUX conditions, et la première n'est pas négociable : son accueil du
  # public doit être ATTESTÉ par OpenStreetMap. Un plancher qui mesure la
  # documentation d'un lieu ne peut pas être franchi par plus de documentation
  # — la première version le permettait, avec un seuil de score seul, et
  # repêchait 2 757 lieux d'un coup. Photo et article francophone valent treize
  # points d'office, et presque tout monument français en a : dans le bas du
  # classement le score est presque constant, il ne discrimine rien.
  #
  # Les horaires sont une preuve d'une autre nature : un fait de terrain. C'est
  # ce qui manquait au musée des impressionnismes de Giverny — cinq langues, et
  # pourtant visité du monde entier.
  #
  # Le score sert de second filtre, pour ne pas repêcher tout ce qui ouvre une
  # billetterie. Le tableau imprimé par `build` donne le nombre de lieux
  # concernés à chaque seuil : c'est là qu'on choisit ce chiffre, pas ailleurs.
  # Abaissé de 85 à 74 EN MÊME TEMPS que le poids des langues, et pour cette
  # seule raison : c'est un seuil ABSOLU. Baisser un poids baisse tous les
  # scores, donc vide le repêchage sans que personne ne l'ait demandé — à 16 et
  # 85, le catalogue perdait 211 lieux. À 16 et 74, il en gagne 18.
  rescue_score: 74.0


  # Les bonus de label sont définis dans labels.yaml (`score_bonus`).
  # Seul le plus élevé s'applique, plus la moitié du deuxième — pour éviter
  # qu'un empilement de petits labels dépasse un site UNESCO.
  label_stacking: half_second

# Fréquentation annuelle, d'après Wikidata.
#
# C'est le seul signal gratuit qui mesure l'AFFLUENCE et non la documentation.
# Le décompte de langues classe une villa d'architecte célèbre dans les revues
# internationales devant la maison de Claude Monet, qui reçoit sept cent mille
# personnes par an : le premier mesure ce qu'on écrit d'un lieu, le second ce
# qu'il vaut le déplacement.
#
# Même règle à trois états que l'ouverture au public, et pour la même raison :
# un lieu sans chiffre ne perd RIEN. Wikidata ne renseigne la fréquentation que
# d'une minorité de sites ; pénaliser les autres reviendrait à noter le zèle
# des contributeurs. Bonus seul, jamais de malus.
visitors:
  # Résolue par `suggest-qids --property`, vérifiable par `verify-qids`.
  # Une propriété erronée ne lève rien — elle rend zéro résultat, en silence.
  property: P1174        # nombre de visiteurs par an
  search: null
  # Poids À CALIBRER sur les chiffres réels : `build` affiche la couverture et
  # la distribution. Trop haut, la fréquentation écrase tout le reste ; trop
  # bas, Giverny reste au niveau 3 de sa propre collection.
  weight: 10.0
  # Le score suit log1p(visiteurs / scale) : dix mille visiteurs valent un
  # demi-poids, dix millions en valent sept. L'écart qui compte est celui entre
  # un musée de sous-préfecture et un site national, pas entre le Louvre et
  # Versailles.
  scale: 10000

# Consultations de l'article francophone, médiane des douze derniers mois.
#
# Le décompte de langues mesure ce que le MONDE écrit d'un lieu ; celui-ci, ce
# que le public d'ICI va y chercher. Le Champ-de-Mars figure dans cinquante-six
# langues parce que la tour Eiffel s'y trouve, et les jardins de la Fontaine
# dans six : le premier classement n'en est pas un.
#
# Ce n'est pas « ça vaut le détour ». Aucune donnée gratuite ne le mesure — les
# notes Google, qui s'en approcheraient, ne peuvent être ni stockées ni
# affichées hors d'une carte Google. C'est la curiosité, son plus proche parent
# gratuit et légal.
#
# Même règle à trois états que la fréquentation : un lieu sans article, ou sans
# consultation enregistrée, ne perd RIEN.
pageviews:
  # Poids NUL : le signal se collecte et s'observe avant de peser. `weigh`
  # montre ce que chaque poids ferait au classement réel, sans rien changer.
  #     python -m roam_pipeline enrich --pageviews
  #     python -m roam_pipeline weigh --theme jardins --weights 0 8 16 24
  weight: 0.0
  # Le score suit log1p(vues / scale). Cinq cents vues par mois valent un
  # demi-poids : c'est l'ordre de grandeur d'un lieu que le public connaît
  # sans qu'il soit national.
  scale: 500

tiers:
  # Le niveau est RELATIF à chaque collection : les meilleurs scores prennent
  # le niveau 1, quel que soit leur score absolu.
  tier1_size: 10
  tier2_size: 25
  # Plancher absolu : on ne remplit pas pour remplir. Un lieu sous ce score
  # ne peut pas être au niveau 1 même s'il est dans les 10 meilleurs.
  tier1_min_score: 45.0
  tier2_min_score: 25.0

collections:
  # Une collection n'existe que si elle a assez de lieux pour être une collection.
  min_places: 8
  # Plafond par défaut, surchargé par `cap` dans themes.yaml.
  max_places: 80

geo:
  # Niveaux géographiques pour lesquels on dérive des collections.
  levels: [departement, region, country]
  # Croisements thème × géographie (ex. « Châteaux de Dordogne »).
  # Soumis aux mêmes règles min_places / max_places : la plupart des croisements
  # seront donc écartés, et c'est voulu — sinon on génère des milliers de
  # collections vides du type « Cascades de la Creuse : 2 lieux ».
  cross_theme_levels: [departement, region]

  # Un lieu qu'on ne sait pas rattacher à un département français reste hors de
  # toute collection géographique : il ne peut apparaître que dans « Le meilleur
  # de France », où il concurrence le Mont Blanc. C'est le cas des collectivités
  # d'outre-mer — Polynésie, Nouvelle-Calédonie, Wallis-et-Futuna — qui n'ont pas
  # de code de département.
  #
  # Les DÉPARTEMENTS d'outre-mer (Guadeloupe, Martinique, Guyane, La Réunion,
  # Mayotte) ont un code et restent au catalogue : la ligne passe entre les DOM
  # et les COM, pas entre métropole et outre-mer.
  require_departement: true

  # Nombre de lieux visé dans CHAQUE département. En dessous, les meilleurs
  # candidats que le plancher de notoriété avait écartés sont repêchés.
  #
  # Le plancher compte les langues d'un article : il mesure la notoriété
  # INTERNATIONALE d'un lieu, et la France rurale n'en a pas. La Creuse gardait
  # un lieu sur seize, les Ardennes trois sur vingt-neuf, pendant que Paris en
  # gardait deux cent dix-huit. Ce qu'il écartait n'était pas du remplissage :
  # le château d'Oiron, les boiseries de Moutier-d'Ahun, les Pierres Jaumâtres.
  #
  # C'est le pendant géographique du quota par département des collections
  # nationales — là on empêche Paris d'occuper toute la place, ici on empêche un
  # département de n'en avoir aucune.
  #
  # Les repêchés sont MARQUÉS dans la revue : c'est le pari le plus fragile du
  # catalogue, il doit se relire comme tel.
  min_per_departement: 12

alerts:
  # Au-dessus, un sommet demande souvent bien plus qu'une randonnée. Certains
  # ont pourtant un téléphérique : c'est un signal de revue, pas une exclusion.
  alpine_elevation_m: 2500
